<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030a; -webkit-user-select: none; user-select: none; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; }
  .tag {
    position: fixed; font: 12px ui-monospace, Menlo, monospace; color: #ff9ce6; letter-spacing: 1px;
    background: rgba(10, 4, 14, 0.66); padding: 5px 10px; border: 1px solid #5a1d4f; pointer-events: none;
  }
  #hint { left: 50%; top: 14px; transform: translateX(-50%); white-space: nowrap; transition: opacity 1.5s; }
  #pad { display: none; }
  @media (pointer: coarse) {
    #pad { display: block; }
    #hint { display: none; }
  }
  .btn {
    position: fixed; bottom: 18px; width: 74px; height: 74px; border-radius: 14px;
    background: rgba(20, 8, 30, 0.45); border: 2px solid rgba(255, 80, 200, 0.6); color: #ffb6ef;
    font: bold 15px ui-monospace, Menlo, monospace; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .btn.on { background: rgba(255, 60, 190, 0.45); }
  #bl { left: 18px; } #br { left: 104px; }
  #bb { right: 104px; } #bg { right: 18px; border-color: rgba(0, 230, 255, 0.7); color: #a8f6ff; }
  #ba, #br2, #bq { right: 18px; top: 18px; bottom: auto; height: 44px; width: 74px; font-size: 13px; }
  #br2 { top: 72px; } #bq { top: 126px; }
  #zone { left: 50%; top: 58px; transform: translateX(-50%); font-size: 16px; letter-spacing: 6px; color: #9ff4ff;
    border-color: #1d4f5a; transition: opacity 1.2s; opacity: 0; }
</style>

<body>
<canvas id="c"></canvas>
<div id="hint" class="tag">&larr; &rarr; steer &nbsp;&middot;&nbsp; &uarr; gas &nbsp;&middot;&nbsp; &darr; brake &nbsp;&middot;&nbsp; A autopilot &nbsp;&middot;&nbsp; W weather &nbsp;&middot;&nbsp; H HD</div>
<div id="zone" class="tag"></div>
<div id="pad">
  <div class="btn" id="bl">&#9664;</div><div class="btn" id="br">&#9654;</div>
  <div class="btn" id="bb">BRK</div><div class="btn" id="bg">GAS</div>
  <div class="btn on" id="ba">AUTO</div>
  <div class="btn on" id="br2">WX</div>
  <div class="btn on" id="bq">HD</div>
</div>
<script>
// Pseudo-3D city street rendered into a small pixel buffer; CSS scales it up with nearest-neighbour.
const SEGL = 4, DRAW = 120;

// eight cities, each a run of districts, joined by a link (skybridge, aqua tube or mega-highway)
const ZONE_NAMES = ['NEON DOWNTOWN', 'LANTERN MARKET', 'GLASS SPIRES', 'UNDERPASS', 'DOCKLANDS', 'SKYBRIDGE', 'HOLO GARDENS',
  'ARCADE ROW', 'MEGA-HIGHWAY', 'STACKTOWN', 'DATA CANYON', 'CONSTRUCTION ZONE', 'SHRINE STREET', 'AQUA TUBE', 'STILT CANALS',
  'CANYON ROAD', 'SPIRAL RAMP'];
const D = { DOWNTOWN: 0, MARKET: 1, SPIRES: 2, TUNNEL: 3, DOCKS: 4, BRIDGE: 5, GARDENS: 6, ARCADE: 7, HIGHWAY: 8, STACK: 9,
  DATA: 10, BUILD: 11, SHRINE: 12, TUBE: 13, CANALS: 14, CANYON: 15, RAMP: 16 };
const CITIES = [
  { name: 'VANTA BAY', weather: 'rain', storm: 1, link: [5, 200],
    zones: [[0, 220], [3, 50], [1, 190], [7, 170], [2, 190], [4, 150]],
    sky: [[6, 4, 16], [30, 10, 46], [104, 32, 96]], fog: [44, 16, 56], tw: [[40, 20, 60], [22, 12, 36]], hue: [200, 300],
    neon: [[255, 46, 170], [0, 234, 255], [255, 214, 64], [170, 90, 255], [70, 255, 150], [255, 110, 50]] },
  { name: 'AURUM HEIGHTS', weather: 'clear', fireworks: 1, elevator: 1, link: [13, 180],
    zones: [[6, 200], [0, 170], [8, 220], [2, 180], [11, 150]],
    sky: [[10, 6, 10], [52, 22, 22], [176, 84, 40]], fog: [74, 38, 28], tw: [[62, 34, 28], [34, 18, 16]], hue: [5, 50],
    neon: [[255, 170, 40], [255, 80, 50], [0, 220, 200], [255, 225, 120], [255, 60, 110], [120, 255, 200]] },
  { name: 'GLACIA', weather: 'fog', link: [5, 200],
    zones: [[2, 190], [1, 170], [16, 170], [10, 170], [3, 50], [0, 160]],
    sky: [[4, 8, 22], [14, 30, 62], [64, 116, 156]], fog: [30, 54, 80], tw: [[32, 46, 72], [16, 24, 42]], hue: [190, 250],
    neon: [[140, 220, 255], [200, 140, 255], [240, 250, 255], [80, 170, 255], [255, 120, 220], [120, 255, 240]] },
  { name: 'NEON LAGOON', weather: 'clear', link: [8, 200],
    zones: [[14, 210], [9, 170], [14, 170], [7, 150]],
    sky: [[2, 10, 20], [8, 40, 60], [30, 120, 130]], fog: [14, 52, 64], tw: [[16, 60, 70], [8, 30, 40]], hue: [160, 200],
    neon: [[0, 255, 220], [255, 70, 200], [180, 255, 80], [80, 160, 255], [255, 220, 90], [200, 120, 255]] },
  { name: 'RUST MESA', weather: 'sand', link: [8, 200],
    zones: [[15, 230], [0, 150], [11, 140], [15, 190]],
    sky: [[20, 8, 8], [90, 30, 20], [220, 110, 50]], fog: [120, 60, 34], tw: [[90, 40, 26], [50, 22, 16]], hue: [0, 30],
    neon: [[255, 120, 40], [255, 200, 90], [60, 220, 255], [255, 60, 60], [255, 240, 180], [180, 90, 255]] },
  { name: 'SAKURA GRID', weather: 'petals', fireworks: 1, link: [5, 200],
    zones: [[12, 210], [6, 170], [1, 170], [12, 150]],
    sky: [[14, 6, 20], [60, 20, 60], [200, 90, 140]], fog: [80, 36, 70], tw: [[70, 30, 60], [40, 16, 36]], hue: [320, 360],
    neon: [[255, 150, 200], [255, 255, 255], [255, 90, 150], [160, 220, 255], [255, 200, 120], [200, 120, 255]] },
  { name: 'BLACKOUT SECTOR', weather: 'rain', storm: 1, dark: 1, link: [13, 180],
    zones: [[9, 190], [0, 180], [10, 170], [3, 50], [9, 140]],
    sky: [[2, 2, 4], [8, 8, 12], [30, 26, 32]], fog: [14, 12, 16], tw: [[14, 14, 18], [8, 8, 10]], hue: [200, 260],
    neon: [[255, 40, 40], [255, 200, 60], [80, 255, 120], [0, 200, 255], [255, 255, 255], [255, 90, 30]] },
  { name: 'AURORA PASS', weather: 'snow', aurora: 1, mountains: 1, link: [5, 200],
    zones: [[0, 170], [2, 150], [6, 140], [3, 60], [11, 120]],
    sky: [[2, 6, 16], [10, 30, 50], [40, 90, 110]], fog: [36, 60, 76], tw: [[40, 60, 80], [22, 34, 48]], hue: [190, 230],
    neon: [[120, 255, 200], [160, 120, 255], [220, 250, 255], [60, 200, 255], [255, 150, 220], [120, 255, 120]] },
];
const LINK_NAMES = { 5: 'SKYBRIDGE', 13: 'AQUA TUBE', 8: 'MEGA-HIGHWAY' };
const ZONES = [];                       // [start, end, district, city, isLink]
const NSEG = (() => {
  let n = 0;
  CITIES.forEach((c, ci) => {
    for (const [d, len] of c.zones) { ZONES.push([n, n + len, d, ci, false]); n += len; }
    ZONES.push([n, n + c.link[1], c.link[0], ci, true]); n += c.link[1];
  });
  return n;
})();
const LEN = NSEG * SEGL;
const ZONE_OF = new Int16Array(NSEG);
ZONES.forEach((z, i) => { for (let n = z[0]; n < z[1]; n++) ZONE_OF[n] = i; });
function zoneAt(n) { return ZONES[ZONE_OF[((n % NSEG) + NSEG) % NSEG]]; }
function district(n) { return zoneAt(n)[2]; }
function zoneEnd(n) { return zoneAt(n)[1]; }
const TUNNEL_STARTS = ZONES.filter(z => z[2] === 3).map(z => z[0]);
let FOG = CITIES[0].fog.slice(), SKY = CITIES[0].sky, TWC = CITIES[0].tw;
const TH = { aurora: 0, mountains: 0, elevator: 0, fireworks: 0, dark: 0, water: 0 };
let fogK = 1;
const RW = 7, SW = 3.2, NEAR = 0.7;
let roll = 0, hd = true;
const maxV = () => 62;
const eye = () => 1.4;
const NEON = [[255, 46, 170], [0, 234, 255], [255, 214, 64], [170, 90, 255], [70, 255, 150], [255, 110, 50]];
const WIN = [[255, 200, 120], [255, 170, 90], [120, 220, 255], [255, 120, 200], [200, 190, 255], [255, 236, 190]];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
function bay(x, y) { return BAYER[(y & 3) * 4 + (x & 3)]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function mulberry(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hsl(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
function fogAt(z) { return smooth(50 * fogK, DRAW * SEGL * (0.42 + 0.4 * fogK), z) * 0.97; }

// ---------- the city (generated once) ----------
const rng = mulberry(2077);
const curve = new Float32Array(NSEG), hill = new Float32Array(NSEG);
for (let n = 0; n < NSEG;) {
  const len = Math.min(NSEG - n, 40 + Math.floor(rng() * 90));
  const c = rng() < 0.4 ? 0 : (rng() < 0.5 ? -1 : 1) * (0.008 + rng() * 0.028);
  for (let i = 0; i < len; i++) curve[n + i] = c * Math.sin(Math.PI * i / len);
  n += len;
}
for (let n = 0; n < NSEG; n++) hill[n] = 4 * Math.sin(n * 2 * Math.PI * 14 / NSEG) + 1.5 * Math.sin(n * 2 * Math.PI * 45 / NSEG);
for (const z of ZONES) {
  const L = z[1] - z[0];
  for (let n = z[0]; n < z[1]; n++) {
    const t = (n - z[0]) / L, edge = smooth(0, 0.15, t) * smooth(0, 0.15, 1 - t);
    if (z[2] === D.BRIDGE) { hill[n] += 14 * Math.sin(Math.PI * t); curve[n] *= 0.3; }
    else if (z[2] === D.HIGHWAY) { hill[n] += 10 * edge; curve[n] *= 0.6; }
    else if (z[2] === D.TUBE) { hill[n] -= 10 * edge; curve[n] *= 0.5; }
    else if (z[2] === D.CANYON) curve[n] *= 1.5;
    else if (z[2] === D.RAMP) {                       // a tight climbing curve around a tower, then back down
      curve[n] = 0.05 * smooth(0, 0.08, t) * smooth(0, 0.08, 1 - t);
      hill[n] += 38 * (t < 0.62 ? smooth(0, 0.62, t) : 1 - smooth(0.62, 1, t));
    }
  }
}

// intersections with traffic lights and a zebra crossing; buildings leave a gap for the cross street
const LIGHT_D = new Set([0, 1, 2, 6, 7, 9, 10, 12, 14]);
const IX = [];
const XROAD = new Uint8Array(NSEG);
for (const z of ZONES) {
  if (z[4] || !LIGHT_D.has(z[2])) continue;
  for (let n = z[0] + 40; n < z[1] - 30; n += 150 + Math.floor(rng() * 90)) {
    IX.push(n);
    for (let i = 0; i < 3; i++) XROAD[n + i] = 1;
  }
}
const IXZ = IX.map(n => n * SEGL);
const LIGHT_PERIOD = 30;
function lightPhase(i) { return ((T + hash(IX[i], 3, 3) * LIGHT_PERIOD) % LIGHT_PERIOD); }
function lightState(i) { const p = lightPhase(i); return p < 16 ? 0 : p < 19 ? 1 : 2; }   // 0 green, 1 yellow, 2 red
function nextIx(z) {                                  // index of the first intersection whose stop line is ahead of world z
  for (let i = 0; i < IXZ.length; i++) if (IXZ[i] - 5 > z) return i;
  return 0;
}

const WARM = [[255, 60, 40], [255, 150, 40], [255, 214, 64], [255, 90, 140]];
const COOL = [[180, 210, 255], [140, 200, 255], [210, 230, 255], [120, 180, 240]];

const blocks = [];
const SIDE = [new Int32Array(NSEG).fill(-1), new Int32Array(NSEG).fill(-1)];
const NOBLD = new Set([D.TUNNEL, D.BRIDGE, D.TUBE, D.RAMP]);
for (let side = 0; side < 2; side++) {
  for (let n = 0; n < NSEG;) {
    const zz = zoneAt(n), d = zz[2], city = CITIES[zz[3]], cn = city.neon, dark = city.dark ? 1 : 0;
    if (NOBLD.has(d) || XROAD[n]) { n++; continue; }
    if (d === D.HIGHWAY && city.elevator && side === 0 && n - zz[0] > 40 && n - zz[0] < 150) { n++; continue; }
    const gapP = d === 2 ? 0.08 : d === 4 ? 0.25 : d === 8 ? 0.45 : d === 15 ? 0.02 : d === 11 ? 0.22 : 0.17;
    if (rng() < gapP) { n += 1 + Math.floor(rng() * (d === 8 ? 6 : 2)); continue; }
    let len = (d === 2 || d === 4 || d === 10 ? 8 : d === 15 ? 12 : 4) + Math.floor(rng() * 12);
    len = Math.min(zz[1] - n, len);
    for (let i = 0; i < len; i++) if (XROAD[n + i]) { len = i; break; }
    if (len <= 0) { n++; continue; }
    const r1 = rng(), r2 = rng();
    const h = d === 1 ? 8 + Math.pow(r1, 1.5) * 22 : d === 2 ? 50 + r1 * 90 : d === 4 ? 9 + r1 * 9
      : d === 6 ? 14 + r1 * 26 : d === 7 ? 18 + r1 * 30 : d === 8 ? 60 + r1 * 110 : d === 9 ? 12 + r1 * 20
      : d === 10 ? 25 + r1 * 30 : d === 11 ? 25 + r1 * 50 : d === 12 ? 7 + r1 * 7 : d === 14 ? 11 + r1 * 14
      : d === 15 ? 35 + r1 * 60 : 12 + Math.pow(r1, 1.7) * 75;
    const pal = d === 1 || d === 12 ? WARM : cn;
    const hue = city.hue[0] + r2 * (city.hue[1] - city.hue[0]);
    const base = d === 1 ? hsl(10 + rng() * 30, 0.28, 0.1 + rng() * 0.07)
      : d === 2 || d === 8 ? hsl(hue, 0.35, 0.12 + rng() * 0.06)
      : d === 4 ? hsl(rng() < 0.5 ? 15 + rng() * 20 : 170 + rng() * 30, 0.3, 0.13 + rng() * 0.06)
      : d === 6 ? hsl(140 + rng() * 60, 0.25, 0.1 + rng() * 0.06)
      : d === 9 ? hsl(10 + rng() * 40, 0.25, 0.12 + rng() * 0.05)
      : d === 10 ? [10, 12, 16]
      : d === 11 ? [150, 80, 30]
      : d === 12 ? hsl(15 + rng() * 15, 0.45, 0.14 + rng() * 0.05)
      : d === 14 ? hsl(170 + rng() * 40, 0.3, 0.13 + rng() * 0.06)
      : d === 15 ? hsl(8 + rng() * 18, 0.5, 0.22 + rng() * 0.08)
      : hsl(hue, 0.22, 0.09 + rng() * 0.08);
    const styleOf = { 8: 2 };
    const B = {
      id: blocks.length, start: n, len, h, style: styleOf[d] !== undefined ? styleOf[d] : d, seed: (rng() * 1e6) | 0, base, dark,
      set: d === 1 || d === 9 || d === 12 ? rng() * 0.6 : d === 2 ? 1 + rng() * 3 : d === 4 ? 3 + rng() * 4 : d === 8 ? 45 + rng() * 40
        : d === 14 ? 3 + rng() * 4 : d === 15 ? rng() * 3 : rng() * 2.5,
      winP: (d === 2 || d === 8 ? 0.45 + rng() * 0.3 : d === 1 || d === 6 || d === 9 ? 0.35 + rng() * 0.3 : d === 4 ? 0.08
        : d === 15 ? 0.06 : 0.15 + rng() * 0.4) * (dark ? 0.12 : 1),
      crown: (d === 2 || d === 8 || d === 7 || rng() < (d === 1 || d === 4 ? 0.15 : 0.45)) && !(dark && rng() < 0.8) && d !== 12 && d !== 15 && d !== 11
        ? cn[(rng() * 6) | 0] : null,
      shop: [pal[(rng() * pal.length) | 0], WIN[(rng() * 6) | 0], pal[(rng() * pal.length) | 0]],
      bbs: [], signs: [],
    };
    if (B.style === 2 && !B.crown) B.crown = cn[0];
    const wc = d === 2 || d === 8 ? [150, 190, 235] : d === 10 ? [40, 120, 80] : [220, 170, 120];
    B.avg = mix(B.base, wc, B.winP * 0.35);
    const L = len * SEGL;
    if (rng() < (d === 2 || d === 8 ? 0.5 : d === 1 || d === 4 ? 0.2 : d === 0 || d === 6 || d === 9 ? 0.55 : 0) * (dark ? 0.3 : 1) && h > 16 && L > 10) {
      const big = d === 2 || d === 8 ? 2 : 1;
      const w = Math.min(L - 2, (6 + rng() * 10) * big), hh = Math.min(h - 8, (4 + rng() * 6) * big), v0 = 6 + rng() * Math.max(0, h - hh - 9);
      const u0 = 1 + rng() * (L - w - 2);
      B.bbs.push({ u0, u1: u0 + w, v0, v1: v0 + hh, kind: (rng() * 3) | 0, c1: cn[(rng() * 6) | 0], c2: cn[(rng() * 6) | 0], seed: (rng() * 1e6) | 0 });
    }
    const ns = [2, 4, 8, 10, 11, 15].includes(d) ? (d === 15 && rng() < 0.4 ? 1 : 0) : d === 1 || d === 9 ? 2 + ((rng() * 3) | 0)
      : d === 12 ? 1 : rng() < 0.65 ? 1 + ((rng() * 2) | 0) : 0;
    for (let i = 0; i < ns; i++) {
      const v0 = 4.2 + rng() * 3, v1 = Math.min(h - 0.5, v0 + 5 + rng() * 9);
      if (v1 - v0 > 3) B.signs.push({ u: 0.5 + rng() * (L - 1), v0, v1, c: pal[(rng() * pal.length) | 0], seed: (rng() * 1e6) | 0,
        dead: dark && rng() < 0.6 });
    }
    blocks.push(B);
    for (let i = 0; i < len; i++) SIDE[side][n + i] = B.id;
    n += len;
  }
}

// people with glowing umbrellas walking the sidewalks
const peds = [];
for (let i = 0; i < 300; i++) {
  const side = rng() < 0.5 ? -1 : 1;
  peds.push({ z: rng() * LEN, x: side * (RW + 0.8 + rng() * (SW - 1.4)), v: (rng() < 0.5 ? -1 : 1) * (0.9 + rng() * 0.8),
    umb: rng() < 0.7 ? NEON[(rng() * 6) | 0] : null, coat: hsl(rng() * 360, 0.2, 0.12 + rng() * 0.1), ph: rng() * 6 });
}
let train = { z: 500, v: -26 };

// traffic
const cars = [];
for (let i = 0; i < 120; i++) {
  const dir = rng() < 0.68 ? 1 : -1;
  cars.push({
    z: rng() * LEN, dir, x: dir * (rng() < 0.5 ? 1.75 : 5.25),
    speed: dir > 0 ? 13 + rng() * 13 : 16 + rng() * 10,
    body: hsl(rng() * 360, 0.25 + rng() * 0.3, 0.14 + rng() * 0.12),
    tail: rng() < 0.6 ? [255, 36, 60] : [255, 40, 170],
    under: NEON[(rng() * 6) | 0], neon: rng() < 0.4,
  });
}

// ---------- buffers ----------
let W, H, N, PX, F, HOR, HB, PW, img, fb, col, lb, refl;
let OW, OH, SWD, SHD, MX, MY, colS, colO, bmask, bcol, vmask, vcol;
function useScene() { W = SWD; H = SHD; N = W * H; col = colS; }
function useOut() { W = OW; H = OH; N = W * H; col = colO; }
let sky1, sky2, mtn, flyers = [], holoX = 0;
const Z = new Float32Array(DRAW + 2), S = new Float32Array(DRAW + 2), CX = new Float32Array(DRAW + 2), GY = new Float32Array(DRAW + 2);

function setup() {
  PX = hd ? Math.max(1.5, Math.max(innerWidth, innerHeight) / 450) : Math.max(2, Math.round(Math.max(innerWidth, innerHeight) / 340));
  OW = Math.ceil(innerWidth / PX); OH = Math.ceil(innerHeight / PX);
  // the scene is rendered with a margin so it can be rolled (motorcycle lean) without empty corners
  const th = 0.27;
  MX = Math.ceil((OW * (Math.cos(th) - 1) + OH * Math.sin(th)) / 2) + 2;
  MY = Math.ceil((OW * Math.sin(th) + OH * (Math.cos(th) - 1)) / 2) + 2;
  SWD = OW + 2 * MX; SHD = OH + 2 * MY;
  cv.width = OW; cv.height = OH;
  cv.style.width = OW * PX + 'px'; cv.style.height = OH * PX + 'px';
  img = ctx.createImageData(OW, OH);
  fb = new Uint32Array(img.data.buffer);
  colS = new Float32Array(SWD * SHD * 3); lb = new Float32Array(SWD * SHD * 3); refl = new Float32Array(SWD * SHD);
  colO = new Float32Array(OW * OH * 3);
  F = Math.max(OW * 0.62, OH * 0.8);
  HB = Math.round(OH * 0.45);
  HOR = MY + HB;
  PW = Math.round(F * 2 * Math.PI);
  useOut();

let PZ, PS, PCX, PGY;

  addLight(PCX, (ya + yb) / 2, Math.max(4, 7 * s), [0, 230, 255], 0.35 * (1 - fz));
}

function drawCar(c, k, dz) {
  if (!projAt(k, dz)) return;
  const s = PS, fz = fogAt(PZ), w = 1.9 * s, h = 1.35 * s, xc = PCX + (c.x - 0) * s, yb = PGY, left = xc - w / 2, top = yb - h;
  const rear = c.dir > 0, lc = rear ? c.tail : [230, 240, 255], vis = 1 - fz;
  if (w < 3) {
    const y = Math.round(yb - h * 0.4);
    putc(Math.round(left), y, lc); putc(Math.round(left + w), y, lc);
    addLight(xc, y, rear ? 2 : 4, lc, (rear ? 0.4 : 0.7) * vis);
    return;
  }
  const bd = c.body;
  for (let x = Math.max(0, Math.ceil(left)); x <= Math.min(W - 1, Math.ceil(left + w) - 1); x++) {
    const u = (x + 0.5 - left) / w;
    for (let y = Math.max(0, Math.ceil(top)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
      const v = (yb - y - 0.5) / h;
      let cc;
      if (v < 0.13) cc = (u < 0.2 || u > 0.8) ? [6, 6, 8] : [10, 10, 14];
      else if (v < 0.24) cc = [bd[0] * 0.55, bd[1] * 0.55, bd[2] * 0.55];
      else if (v < 0.33 && u > 0.4 && u < 0.6) cc = rear ? [170, 170, 150] : [30, 30, 40];
      else if (v > 0.36 && v < 0.47) {
        if (rear) cc = (u < 0.28 || u > 0.72) ? lc : [lc[0] * 0.45, lc[1] * 0.45, lc[2] * 0.45];
        else cc = (u < 0.28 || u > 0.72) ? lc : [20, 20, 28];
      } else if (v < 0.58) cc = v > 0.54 ? [bd[0] * 1.7, bd[1] * 1.7, bd[2] * 1.7] : bd;
      else {
        const inset = 0.1 + (v - 0.58) * 0.45;
        if (u < inset || u > 1 - inset) continue;
        if (v > 0.62 && v < 0.92 && u > inset + 0.05 && u < 1 - inset - 0.05) {
          cc = ((u * 3 + v * 2 + 0.3) % 1) < 0.14 ? [70, 46, 100] : [16, 18, 30];
        } else cc = [bd[0] * 1.15, bd[1] * 1.15, bd[2] * 1.15];
      }
      put(x, y, cc[0] + (FOG[0] - cc[0]) * fz, cc[1] + (FOG[1] - cc[1]) * fz, cc[2] + (FOG[2] - cc[2]) * fz);
      refl[y * W + x] = 0;
    }
  }
  const ly = yb - h * 0.42;
  if (PZ > 220) return;
  if (rear) {
    const bi = c.brk ? 0.95 : 0.5;
    addLight(left + w * 0.14, ly, clamp(w * (c.brk ? 0.7 : 0.45), 2, 20), lc, bi * vis);
    addLight(left + w * 0.86, ly, clamp(w * (c.brk ? 0.7 : 0.45), 2, 20), lc, bi * vis);
  } else {
    addLight(left + w * 0.14, ly, clamp(w * 0.9, 3, 30), lc, 0.85 * vis);
    addLight(left + w * 0.86, ly, clamp(w * 0.9, 3, 30), lc, 0.85 * vis);
  }
  if (c.neon) addLight(xc, yb, clamp(w * 0.75, 2, 24), c.under, 0.4 * vis);
}

// tiny 3x5 font
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001001001001', '8': '111101111101111', '9': '111101111001111',
  'K': '101101110101101', 'M': '101111111101101', 'H': '101101111101101', '/': '001001010100100', 'A': '010101111101101',
  'U': '101101101101111', 'T': '111010010010010', 'O': '111101101101111', 'N': '110101101101101', 'L': '100100100100111',
  'R': '110101110101101', 'I': '111010010010111', ' ': '000000000000000', 'E': '111100110100111', 'P': '111101111100100',
  'D': '110101101101110', 'S': '111100111001111', 'C': '111100100100111',
  'V': '101101101101010', 'B': '110101110101110', 'Y': '101101010010010', 'G': '111100101101111',
};
function text(str, x, y, c, sc) {
  for (const ch of str) {
    const g = FONT[ch] || FONT[' '];
    for (let i = 0; i < 15; i++) if (g[i] === '1')
      for (let a = 0; a < sc; a++) for (let b = 0; b < sc; b++) putc(x + (i % 3) * sc + a, y + Math.floor(i / 3) * sc + b, c);
    x += 4 * sc;
  }
}

function drawGlass() {
  // rain streaks outside
  for (const s of streaks) {
    const cd = Math.abs(s.x - W / 2) / W + Math.abs(s.y - H * 0.42) / H;   // fainter near the centre of view
    const fade = Math.min(1, cd * 2.5);
    const x = Math.round(s.x), y = Math.round(s.y);
    if (s.kind === 'rain') { const a = 0.09 * fade; if (a > 0.01) for (let k = 0; k < s.l; k++) addc(Math.round(s.x - steer * k * 0.3), y - k, [130, 150, 200], a); }
    else if (s.kind === 'snow') { addc(x, y, [230, 240, 255], 0.75 * fade); if (s.l > 4.5 && cd > 0.3) addc(x + 1, y, [230, 240, 255], 0.5 * fade); }
    else if (s.kind === 'petals') { const c = [255, 170, 210]; addc(x, y, c, 0.9 * fade); addc(x + (Math.sin(T * 5 + s.ph) > 0 ? 1 : -1), y, c, 0.6 * fade); }
    else if (s.kind === 'sand') { for (let k = 0; k < s.l * 2.5; k++) addc(x - k, y, [230, 160, 90], 0.14 * (1 - k / (s.l * 2.5))); }
  }
  // droplets on the windshield refract what is behind them
  for (const d of drops) {
    const x = Math.round(d.x), y = Math.round(d.y);
    if (x < 1 || y < 3 || x >= W - 1 || y >= H - 1) continue;
    const j = (y * W + x) * 3;
    put(x, y, col[j] * 1.15 + 22, col[j + 1] * 1.15 + 24, col[j + 2] * 1.15 + 30);
    if (d.s === 2) { const k = ((y + 1) * W + x) * 3; put(x, y + 1, col[k] * 0.7, col[k + 1] * 0.7, col[k + 2] * 0.7); }
  }
}

function thick(x0, y0, x1, y1, r, c, hi) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++)
      if (a * a + b * b <= r * r + 0.5) putc(Math.round(x + a), Math.round(y + b), b < -r * 0.4 ? hi : c);
  }
}

function drawBike() {
  for (let i = 0; i < N; i++) {
    const m = bmask[i]; if (!m) continue;
    const j = i * 3;
    if (m === 1) { col[j] = bcol[j]; col[j + 1] = bcol[j + 1]; col[j + 2] = bcol[j + 2]; }
    else { col[j] = col[j] * 0.7 + bcol[j]; col[j + 1] = col[j + 1] * 0.7 + bcol[j + 1]; col[j + 2] = col[j + 2] * 0.75 + bcol[j + 2]; }
  }
  // instrument screen
  const sw = Math.round(W * 0.15), sh = Math.round(H * 0.1), sx0 = Math.round(W / 2 - sw / 2), sy0 = Math.round(H * 0.8) + 2;
  for (let x = sx0; x < sx0 + sw; x++) for (let y = sy0; y < sy0 + sh && y < H; y++)
    putc(x, y, x === sx0 || x === sx0 + sw - 1 || y === sy0 || y === sy0 + sh - 1 ? [60, 40, 96] : [6, 8, 18]);
  const sc = H > 200 ? 2 : 1, kmh = String(Math.round(speed * 3.6)).padStart(3, ' ');
  text(kmh, Math.round(W / 2 - 6 * sc), sy0 + 4, [0, 235, 255], sc);
  if (waitLight) text('RED', Math.round(W / 2 - 5), sy0 + 6 + 5 * sc, (T * 2) % 1 < 0.6 ? [255, 60, 60] : [120, 30, 30], 1);
  else text(auto ? 'AUTO' : 'MANUAL', Math.round(W / 2 - (auto ? 7 : 11)), sy0 + 6 + 5 * sc, auto ? [80, 255, 150] : [255, 150, 60], 1);
  const segs = 12, bw = Math.max(2, Math.floor((sw - 6) / segs));
  for (let i = 0; i < segs; i++) {
    const on = i < Math.round(speed / maxV() * segs), c = mix([0, 230, 255], [255, 40, 170], i / segs);
    for (let a = 0; a < bw - 1; a++) putc(Math.round(W / 2 - segs * bw / 2) + i * bw + a, sy0 + 2, on ? c : [30, 22, 44]);
  }
  // handlebars turn a little with the steering; rubber grips with neon bar-end caps
  const a = steer * 0.07, pcx = W / 2, pcy = H * 0.87, r = Math.max(1, Math.round(H * 0.008));
  for (const sd of [-1, 1]) {
    const ex = W * 0.37 * sd, ey = -H * 0.075;
    const gx = pcx + ex * Math.cos(a) - ey * Math.sin(a), gy = pcy + ex * Math.sin(a) + ey * Math.cos(a);
    thick(pcx + sd * W * 0.05, pcy, gx, gy, r, [28, 26, 38], [80, 72, 104]);
    const gx2 = pcx + (ex * 1.12) * Math.cos(a) - (ey * 1.12) * Math.sin(a), gy2 = pcy + (ex * 1.12) * Math.sin(a) + (ey * 1.12) * Math.cos(a);
    const gx1 = pcx + (ex * 0.86) * Math.cos(a) - (ey * 0.86) * Math.sin(a), gy1 = pcy + (ex * 0.86) * Math.sin(a) + (ey * 0.86) * Math.cos(a);
    thick(gx1, gy1, gx2, gy2, r + 2, [16, 14, 22], [48, 42, 62]);
    const ec = sd < 0 ? [0, 230, 255] : [255, 50, 180];
    thick(gx2, gy2, gx2 + sd * 1.5, gy2, r + 1, ec, mix(ec, [255, 255, 255], 0.4));
  }
  // helmet visor frame
  for (let i = 0; i < N; i++) if (vmask[i]) { const j = i * 3; col[j] = vcol[j]; col[j + 1] = vcol[j + 1]; col[j + 2] = vcol[j + 2]; }
}

function render() {
  useScene();
  lb.fill(0); refl.fill(0);
  const base = Math.floor(camZ / SEGL), frac = camZ / SEGL - base;
  const b0 = base % NSEG, b1 = (base + 1) % NSEG;
  const camY = hill[b0] + (hill[b1] - hill[b0]) * frac + eye() + Math.sin(camZ * 0.9) * 0.015 * Math.min(1, speed / 20);
  const sh = shake * 3, hy = HOR + (Math.random() - 0.5) * sh;
  const camX = px + (Math.random() - 0.5) * shake * 0.4;
  blendTheme(base);

  let x = 0, dx = -curve[b0] * frac;
  for (let k = 0; k <= DRAW; k++) {
    const n = (base + k) % NSEG;
    const z = Math.max(NEAR, (k - frac) * SEGL);
    Z[k] = z; S[k] = F / z;
    CX[k] = W / 2 + (x - camX) * S[k];
    GY[k] = hy - (hill[n] - camY) * S[k];
    x += dx; dx += curve[n];
  }

  drawSky(hy);

  // traffic sorted into segments
  const buckets = new Map();
  for (const c of cars) {
    const r = rel(c.z), k = Math.floor(r / SEGL + frac);
    if (k < 0 || k >= DRAW || r < NEAR) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push({ c, r });
  }
  FRAC = frac;
  const put_ = (k, o) => { if (k < 0 || k >= DRAW) return; if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(o); };
  for (let i = 0; i < IX.length; i++) {
    const r = rel(IXZ[i] + 13);                       // signals stand on the far side of the junction
    if (r > DRAW * SEGL + 20) continue;
    if (r > NEAR && r < DRAW * SEGL) put_(Math.floor(r / SEGL + frac), { sig: i, r });
    for (const c of crossers(i)) { const rc = rel(c.z); if (rc > NEAR) put_(Math.floor(rc / SEGL + frac), { xp: c, r: rc }); }
  }
  for (const o of drones) { const r = o.z - camZ; if (r > NEAR) put_(Math.floor(r / SEGL + frac), { dr: o, r }); }
  for (const o of bikes) { const r = o.z - camZ; if (r > NEAR) put_(Math.floor(r / SEGL + frac), { bk: o, r }); }
  for (const o of xfly) { const r = o.z - camZ; if (r > NEAR) put_(Math.floor(r / SEGL + frac), { xf: o, r }); }
  for (const p of peds) {
    const r = rel(p.z), k = Math.floor(r / SEGL + frac);
    if (k < 0 || k >= DRAW || r < NEAR || district(Math.floor(p.z / SEGL)) === 3) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push({ p, r });
  }

  // companions that travel alongside: a whale in the sea tube, a hologram dragon over shrines and canals
  const dHere = district(base);
  const rWhale = 46 + Math.sin(T * 0.2) * 10, rDragon = 52 + Math.sin(T * 0.13) * 12;
  const kWhale = dHere === D.TUBE && TH.water > 0.6 ? Math.floor(rWhale / SEGL + frac) : -1;
  const kDragon = dHere === D.SHRINE || dHere === D.CANALS ? Math.floor(rDragon / SEGL + frac) : -1;

  for (let k = DRAW - 1; k >= 0; k--) {
    const n = (base + k) % NSEG;
    const zz = zoneAt(n), d = zz[2], cty = CITIES[zz[3]];
    drawGround(k, d);
    if (d === D.BRIDGE) drawSkybridge(k, n);
    else if (d === D.TUNNEL) { drawTunnel(k, n); if (k > 0 && TUNNEL_STARTS.includes(n)) drawPortal(k); }
    else if (d === D.TUBE) drawTube(k, n);
    else if (d === D.RAMP) drawRamp(k, n);
    else {
      drawWall(k, 0, n);
      drawWall(k, 1, n);
      if (d === D.HIGHWAY) {
        drawHighway(k, n, zz);
        if (cty.elevator && n === zz[0] + 130) drawStadium(k);
        const rz = racer.z - camZ;
        if (rz < Z[k + 1] && rz + 90 > Z[k]) {
          quadWall(k, RW + SW + 6, 0.4, 4.2, racerTex);
          if (projAt(k, 0)) addLight(PCX + (RW + SW + 6) * PS, PGY - 2.5 * PS, Math.min(20, 3 * PS), [255, 220, 170], 0.3 * (1 - fogAt(PZ)));
        }
      }
      if (d === D.MARKET && n % 2 === 0) for (const sg of [-1, 1]) if (hash(n, sg + 5, 31) < 0.45) drawStall(k, sg, n);
      if (n % 9 === 0 && ![D.MARKET, D.GARDENS, D.SHRINE, D.HIGHWAY].includes(d)) { drawLamp(k, n, -1); drawLamp(k, n, 1); }
      if (d === D.DOCKS) {
        if (n % 3 === 0) for (const sg of [-1, 1]) if (hash(n, sg + 9, 41) < 0.6) drawContainers(k, sg, n);
        if (n % 45 === 20) drawCrane(k, hash(n, 2, 43) < 0.5 ? -1 : 1, n);
      }
      if (d === D.BUILD) { if (n % 2 === 0) drawCones(k, n); if (n % 40 === 15) drawCrane(k, hash(n, 2, 43) < 0.5 ? -1 : 1, n); }
      const pink = cty.name === 'SAKURA GRID' ? PINK : null;
      if ((d === D.GARDENS || d === D.SHRINE) && n % 2 === 1) for (const sg of [-1, 1]) drawTree(k, sg, n, d === D.SHRINE ? PINK : pink);
      if (d === D.CANALS && n % 7 === 0) drawBoat(k, n);
      if (d === D.DATA && n % 11 === 0) drawLaser(k, n, hash(n, 4, 4) < 0.5 ? -1 : 1, 30 + hash(n, 5, 5) * 20);
      if ([D.DOWNTOWN, D.SPIRES, D.DOCKS, D.STACK, D.DATA, D.BUILD].includes(d) && hash(n, 7, 77) < 0.05) drawSteam(k, hash(n, 8, 78) < 0.5 ? -3.5 : 3.5, 0, n, 1);
    }
    const bk = buckets.get(k);
    if (bk) {
      bk.sort((a, b) => b.r - a.r);
      for (const o of bk) {
        const dz = o.r - Z[k];
        if (o.c) drawCar(o.c, k, dz); else if (o.p) drawPed(o.p, k, dz); else if (o.sig !== undefined) drawSignal(o.sig, k, dz);
        else if (o.xp) drawCrosser(o.xp, k, dz); else if (o.dr) drawDrone(o.dr, k, dz); else if (o.bk) drawRider(o.bk, k, dz); else if (o.xf) drawFlyer(o.xf, k, dz);
      }
    }
    if (d === D.SHRINE && n % 3 === 0) drawTorii(k, n);
    if (d === D.STACK && n % 4 === 2) drawLaundry(k, n);
    if (d === 0 || d === 2) drawMonorail(k, n);
    if (d === 0 && n % 7 === 3) drawWires(k, n);
    if (d === 1 && n % 3 === 0) drawLanterns(k, n);
    if ((d === 0 || d === 2) && n % 170 === 85) drawBridge(k);
    if (![D.TUNNEL, D.BRIDGE, D.TUBE, D.RAMP].includes(d) && n % 300 === 150) drawKoi(k, n);
    { const zz = zoneAt(n);
      if (zz[4] && zz[2] !== D.TUBE && n === zz[0] + 4) drawGantry(k, CITIES[(zz[3] + 1) % CITIES.length]);
      if (!zz[4] && n === zz[0] + 2 && zoneAt(n - 3)[4] && zz[2] !== D.TUNNEL) drawGantry(k, CITIES[zz[3]]); }
  }

  if (kWhale >= 0) drawWhale(kWhale, rWhale - Z[kWhale]);       // seen through the glass, so drawn last
  if (kDragon >= 0) drawDragon(kDragon, rDragon - Z[kDragon]);   // a hologram floats in front of everything
  addLight(W / 2, hy + eye() * F / 14, Math.min(30, F * 2.4 / 14), [190, 215, 255], 0.22 + 0.3 * TH.dark);
  if (TH.dark > 0.3) addLight(W / 2, hy + eye() * F / 30, 24, [190, 215, 255], 0.25 * TH.dark);

  // glow, then wet-road reflections of everything above the horizon
  for (let i = 0; i < N * 3; i++) col[i] += lb[i];
  const hr = Math.round(hy);
  for (let y = hr + 1; y < H; y++) {
    const ys = 2 * hr - y; if (ys < 0) break;
    const wob = Math.round(Math.sin(y * 0.9 + T * 5) * 0.6);
    for (let x = 0; x < W; x++) {
      const i = y * W + x, k = refl[i]; if (!k) continue;
      const xs = clamp(x + wob, 0, W - 1), j = (ys * W + xs) * 3, o = i * 3;
      const lum = col[j] * 0.3 + col[j + 1] * 0.5 + col[j + 2] * 0.2, kk = k * 0.55 * smooth(70, 190, lum);
      if (kk <= 0.01) continue;
      col[o] += (col[j] - col[o]) * kk; col[o + 1] += (col[j + 1] - col[o + 1]) * kk; col[o + 2] += (col[j + 2] - col[o + 2]) * kk;
    }
  }

  // roll the scene (motorcycle lean) into the output buffer
  {
    const ca = Math.cos(roll), sa = Math.sin(roll), pcx = OW / 2, pcy = OH / 2, scx = SWD / 2, scy = SHD / 2, src = colS, dst = colO;
    for (let oy = 0, o = 0; oy < OH; oy++) {
      const dy = oy + 0.5 - pcy;
      for (let ox = 0; ox < OW; ox++, o += 3) {
        const dx = ox + 0.5 - pcx;
        const sx = clamp(Math.floor(ca * dx - sa * dy + scx), 0, SWD - 1), sy = clamp(Math.floor(sa * dx + ca * dy + scy), 0, SHD - 1);
        const j = (sy * SWD + sx) * 3;
        dst[o] = src[j]; dst[o + 1] = src[j + 1]; dst[o + 2] = src[j + 2];
      }
    }
  }
  useOut();
  drawGlass();
  drawBike();

  const fl = crashFlash * 120;
  for (let i = 0, j = 0; i < N; i++, j += 3) {
    let r = col[j] + fl, g = col[j + 1] + fl * 0.3, b = col[j + 2] + fl * 0.4;
    r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
    fb[i] = (255 << 24) | (b << 16) | (g << 8) | r;
  }
  ctx.putImageData(img, 0, 0);
}

function frame(now) {
  const rawDt = (now - last) / 1000;
  const dt = Math.min(0.05, rawDt); last = now;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---------- input ----------
const btnA = document.getElementById('ba');
function setAuto(on) {
  auto = on; idle = 0;
  if (on) autoLane = px < 3.5 ? 1.75 : 5.25;
  btnA.classList.toggle('on', on);
}
function manual() { if (auto) setAuto(false); idle = 0; }
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'gas', ArrowDown: 'brake' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; manual(); e.preventDefault(); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!auto);
  else if ('rRwW'.includes(e.key)) toggleRain();
  else if (e.key === 'h' || e.key === 'H') setHD(!hd);
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
function hold(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); manual(); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
hold('bl', 'left'); hold('br', 'right'); hold('bg', 'gas'); hold('bb', 'brake');
btnA.addEventListener('pointerdown', e => { e.preventDefault(); setAuto(!auto); });
const btnR = document.getElementById('br2');
function toggleRain() { rainOn = !rainOn; if (!rainOn) drops = []; btnR.classList.toggle('on', rainOn); }
btnR.addEventListener('pointerdown', e => { e.preventDefault(); toggleRain(); });
