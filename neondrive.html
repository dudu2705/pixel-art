<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030a; -webkit-user-select: none; user-select: none; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; touch-action: none; }
  .tag {
    position: fixed; font: 12px ui-monospace, Menlo, monospace; color: #ff9ce6; letter-spacing: 1px;
    background: rgba(10, 4, 14, 0.66); padding: 5px 10px; border: 1px solid #5a1d4f; pointer-events: none;
  }
  #hint { left: 50%; top: 14px; transform: translateX(-50%); white-space: nowrap; transition: opacity 1.5s; }
  #pad { display: none; }
  @media (pointer: coarse) {
    #pad { display: block; }
    #hint { display: none; }
  }
  .btn {
    position: fixed; bottom: 18px; width: 74px; height: 74px; border-radius: 14px;
    background: rgba(20, 8, 30, 0.45); border: 2px solid rgba(255, 80, 200, 0.6); color: #ffb6ef;
    font: bold 15px ui-monospace, Menlo, monospace; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .btn.on { background: rgba(255, 60, 190, 0.45); }
  #bl { left: 18px; } #br { left: 104px; }
  #bb { right: 104px; } #bg { right: 18px; border-color: rgba(0, 230, 255, 0.7); color: #a8f6ff; }
  #ba, #bv { right: 18px; top: 18px; bottom: auto; height: 44px; width: 74px; font-size: 13px; }
  #bv { top: 72px; } #br2 { top: 126px; } #bq { top: 180px; }
  #ba, #bv, #br2, #bq { right: 18px; bottom: auto; height: 44px; width: 74px; font-size: 13px; }
  #zone { left: 50%; top: 58px; transform: translateX(-50%); font-size: 16px; letter-spacing: 6px; color: #9ff4ff;
    border-color: #1d4f5a; transition: opacity 1.2s; opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="tag">&larr; &rarr; steer &nbsp;&middot;&nbsp; &uarr; gas &nbsp;&middot;&nbsp; &darr; brake &nbsp;&middot;&nbsp; A autopilot &nbsp;&middot;&nbsp; V bike/car &nbsp;&middot;&nbsp; R rain &nbsp;&middot;&nbsp; H HD</div>
<div id="zone" class="tag"></div>
<div id="pad">
  <div class="btn" id="bl">&#9664;</div><div class="btn" id="br">&#9654;</div>
  <div class="btn" id="bb">BRK</div><div class="btn" id="bg">GAS</div>
  <div class="btn on" id="ba">AUTO</div>
  <div class="btn" id="bv">CAR</div>
  <div class="btn on" id="br2">RAIN</div>
  <div class="btn on" id="bq">HD</div>
</div>
<script>
// Pseudo-3D city street rendered into a small pixel buffer; CSS scales it up with nearest-neighbour.
const SEGL = 4, DRAW = 120;

// three cities joined by long bridges; each city is a run of districts
// districts: 0 downtown, 1 lantern market, 2 glass spires, 3 tunnel, 4 docklands, 5 skybridge, 6 holo gardens
const ZONE_NAMES = ['NEON DOWNTOWN', 'LANTERN MARKET', 'GLASS SPIRES', 'UNDERPASS', 'DOCKLANDS', 'SKYBRIDGE', 'HOLO GARDENS'];
const CITIES = [
  { name: 'VANTA BAY', zones: [[0, 260], [3, 50], [1, 230], [2, 230], [4, 180]],
    sky: [[6, 4, 16], [30, 10, 46], [104, 32, 96]], fog: [44, 16, 56], tw: [[40, 20, 60], [22, 12, 36]], hue: [200, 300],
    neon: [[255, 46, 170], [0, 234, 255], [255, 214, 64], [170, 90, 255], [70, 255, 150], [255, 110, 50]] },
  { name: 'AURUM HEIGHTS', zones: [[6, 240], [0, 220], [3, 50], [2, 200], [4, 190]],
    sky: [[10, 6, 10], [52, 22, 22], [176, 84, 40]], fog: [74, 38, 28], tw: [[62, 34, 28], [34, 18, 16]], hue: [5, 50],
    neon: [[255, 170, 40], [255, 80, 50], [0, 220, 200], [255, 225, 120], [255, 60, 110], [120, 255, 200]] },
  { name: 'GLACIA', zones: [[2, 220], [1, 200], [3, 50], [6, 220], [0, 210]],
    sky: [[4, 8, 22], [14, 30, 62], [64, 116, 156]], fog: [30, 54, 80], tw: [[32, 46, 72], [16, 24, 42]], hue: [190, 250],
    neon: [[140, 220, 255], [200, 140, 255], [240, 250, 255], [80, 170, 255], [255, 120, 220], [120, 255, 240]] },
];
const BRIDGE_LEN = 200;
const ZONES = [];
const NSEG = (() => {
  let n = 0;
  CITIES.forEach((c, ci) => {
    for (const [d, len] of c.zones) { ZONES.push([n, n + len, d, ci]); n += len; }
    ZONES.push([n, n + BRIDGE_LEN, 5, ci]); n += BRIDGE_LEN;
  });
  return n;
})();
const LEN = NSEG * SEGL;
function zoneAt(n) { n = ((n % NSEG) + NSEG) % NSEG; for (const z of ZONES) if (n < z[1]) return z; return ZONES[0]; }
function district(n) { return zoneAt(n)[2]; }
function zoneEnd(n) { return zoneAt(n)[1]; }
const TUNNEL_STARTS = ZONES.filter(z => z[2] === 3).map(z => z[0]);
let FOG = CITIES[0].fog.slice(), SKY = CITIES[0].sky, TWC = CITIES[0].tw;
const RW = 7, SW = 3.2, NEAR = 0.7;
let bike = true, roll = 0, hd = true;
const maxV = () => bike ? 62 : 50;
const eye = () => bike ? 1.4 : 1.15;
const NEON = [[255, 46, 170], [0, 234, 255], [255, 214, 64], [170, 90, 255], [70, 255, 150], [255, 110, 50]];
const WIN = [[255, 200, 120], [255, 170, 90], [120, 220, 255], [255, 120, 200], [200, 190, 255], [255, 236, 190]];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
function bay(x, y) { return BAYER[(y & 3) * 4 + (x & 3)]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function smooth(a, b, v) { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function mulberry(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hsl(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
function fogAt(z) { return smooth(50, DRAW * SEGL * 0.82, z) * 0.97; }

// ---------- the city (generated once) ----------
const rng = mulberry(2077);
const curve = new Float32Array(NSEG), hill = new Float32Array(NSEG);
for (let n = 0; n < NSEG;) {
  const len = Math.min(NSEG - n, 40 + Math.floor(rng() * 90));
  const c = rng() < 0.4 ? 0 : (rng() < 0.5 ? -1 : 1) * (0.008 + rng() * 0.028);
  for (let i = 0; i < len; i++) curve[n + i] = c * Math.sin(Math.PI * i / len);
  n += len;
}
for (let n = 0; n < NSEG; n++) hill[n] = 4 * Math.sin(n * 2 * Math.PI * 6 / NSEG) + 1.5 * Math.sin(n * 2 * Math.PI * 20 / NSEG);
for (const z of ZONES) if (z[2] === 5) {           // bridges arch up over the water and run straight
  for (let n = z[0]; n < z[1]; n++) { const t = (n - z[0]) / (z[1] - z[0]); hill[n] += 14 * Math.sin(Math.PI * t); curve[n] *= 0.3; }
}

const WARM = [[255, 60, 40], [255, 150, 40], [255, 214, 64], [255, 90, 140]];
const COOL = [[180, 210, 255], [140, 200, 255], [210, 230, 255], [120, 180, 240]];

const blocks = [];
const SIDE = [new Int32Array(NSEG).fill(-1), new Int32Array(NSEG).fill(-1)];
for (let side = 0; side < 2; side++) {
  for (let n = 0; n < NSEG;) {
    const zz = zoneAt(n), d = zz[2], city = CITIES[zz[3]], cn = city.neon;
    if (d === 3 || d === 5) { n++; continue; }
    if (rng() < (d === 2 ? 0.08 : d === 4 ? 0.25 : 0.17)) { n += 1 + Math.floor(rng() * 2); continue; }
    const len = Math.min(zz[1] - n, (d === 2 || d === 4 ? 8 : 4) + Math.floor(rng() * 12));
    const h = d === 1 ? 8 + Math.pow(rng(), 1.5) * 22 : d === 2 ? 50 + rng() * 90 : d === 4 ? 9 + rng() * 9
      : d === 6 ? 14 + rng() * 26 : 12 + Math.pow(rng(), 1.7) * 75;
    const pal = d === 1 ? WARM : cn;
    const hue = city.hue[0] + rng() * (city.hue[1] - city.hue[0]);
    const base = d === 1 ? hsl(10 + rng() * 30, 0.28, 0.1 + rng() * 0.07)
      : d === 2 ? hsl(hue, 0.35, 0.12 + rng() * 0.06)
      : d === 4 ? hsl(rng() < 0.5 ? 15 + rng() * 20 : 170 + rng() * 30, 0.3, 0.13 + rng() * 0.06)
      : d === 6 ? hsl(140 + rng() * 60, 0.25, 0.1 + rng() * 0.06)
      : hsl(hue, 0.22, 0.09 + rng() * 0.08);
    const B = {
      id: blocks.length, start: n, len, h, style: d, seed: (rng() * 1e6) | 0, base,
      set: d === 1 ? rng() * 0.8 : d === 2 ? 1 + rng() * 3 : d === 4 ? 3 + rng() * 4 : rng() * 2.5,
      winP: d === 2 ? 0.45 + rng() * 0.3 : d === 1 || d === 6 ? 0.35 + rng() * 0.3 : d === 4 ? 0.08 : 0.15 + rng() * 0.4,
      crown: d === 2 || rng() < (d === 1 || d === 4 ? 0.15 : 0.45) ? cn[(rng() * 6) | 0] : null,
      shop: [pal[(rng() * pal.length) | 0], WIN[(rng() * 6) | 0], pal[(rng() * pal.length) | 0]],
      bbs: [], signs: [],
    };
    const wc = d === 2 ? [150, 190, 235] : [220, 170, 120];
    B.avg = mix(B.base, wc, B.winP * 0.35);
    const L = len * SEGL;
    if (rng() < (d === 2 ? 0.5 : d === 1 || d === 4 ? 0.2 : 0.55) && h > 16 && L > 10) {
      const big = d === 2 ? 2 : 1;
      const w = Math.min(L - 2, (6 + rng() * 10) * big), hh = Math.min(h - 8, (4 + rng() * 6) * big), v0 = 6 + rng() * Math.max(0, h - hh - 9);
      const u0 = 1 + rng() * (L - w - 2);
      B.bbs.push({ u0, u1: u0 + w, v0, v1: v0 + hh, kind: (rng() * 3) | 0, c1: cn[(rng() * 6) | 0], c2: cn[(rng() * 6) | 0], seed: (rng() * 1e6) | 0 });
    }
    const ns = d === 2 || d === 4 ? 0 : d === 1 ? 2 + ((rng() * 3) | 0) : rng() < 0.65 ? 1 + ((rng() * 2) | 0) : 0;
    for (let i = 0; i < ns; i++) {
      const v0 = 4.2 + rng() * 3, v1 = Math.min(h - 0.5, v0 + 5 + rng() * 9);
      if (v1 - v0 > 3) B.signs.push({ u: 0.5 + rng() * (L - 1), v0, v1, c: pal[(rng() * pal.length) | 0], seed: (rng() * 1e6) | 0 });
    }
    blocks.push(B);
    for (let i = 0; i < len; i++) SIDE[side][n + i] = B.id;
    n += len;
  }
}

// people with glowing umbrellas walking the sidewalks
const peds = [];
for (let i = 0; i < 110; i++) {
  const side = rng() < 0.5 ? -1 : 1;
  peds.push({ z: rng() * LEN, x: side * (RW + 0.8 + rng() * (SW - 1.4)), v: (rng() < 0.5 ? -1 : 1) * (0.9 + rng() * 0.8),
    umb: rng() < 0.7 ? NEON[(rng() * 6) | 0] : null, coat: hsl(rng() * 360, 0.2, 0.12 + rng() * 0.1), ph: rng() * 6 });
}
let train = { z: 500, v: -26 };

// traffic
const cars = [];
for (let i = 0; i < 46; i++) {
  const dir = rng() < 0.68 ? 1 : -1;
  cars.push({
    z: rng() * LEN, dir, x: dir * (rng() < 0.5 ? 1.75 : 5.25),
    speed: dir > 0 ? 13 + rng() * 13 : 16 + rng() * 10,
    body: hsl(rng() * 360, 0.25 + rng() * 0.3, 0.14 + rng() * 0.12),
    tail: rng() < 0.6 ? [255, 36, 60] : [255, 40, 170],
    under: NEON[(rng() * 6) | 0], neon: rng() < 0.4,
  });
}

// ---------- buffers ----------
let W, H, N, PX, F, HOR, HB, PW, img, fb, col, lb, refl, dmask, dcol;
let OW, OH, SWD, SHD, MX, MY, colS, colO, bmask, bcol, vmask, vcol;
function useScene() { W = SWD; H = SHD; N = W * H; col = colS; }
function useOut() { W = OW; H = OH; N = W * H; col = colO; }
let sky1, sky2, flyers = [], holoX = 0;
const Z = new Float32Array(DRAW + 2), S = new Float32Array(DRAW + 2), CX = new Float32Array(DRAW + 2), GY = new Float32Array(DRAW + 2);

function dashTopAt(x) {
  const u = x / W - 0.5;
  let t = H * 0.8 + u * u * H * 0.16;
  if (Math.abs(u) < 0.15) t -= Math.cos(u / 0.15 * Math.PI / 2) * H * 0.03;
  return t;
}
function roofAt(x) { const u = x / W - 0.5; return H * 0.05 + u * u * H * 0.1; }
function pillarAt(y) { const t = clamp(1 - y / (H * 0.8), 0, 1); return W * 0.02 + t * t * W * 0.11; }

function setup() {
  PX = hd ? Math.max(1.5, Math.max(innerWidth, innerHeight) / 450) : Math.max(2, Math.round(Math.max(innerWidth, innerHeight) / 340));
  OW = Math.ceil(innerWidth / PX); OH = Math.ceil(innerHeight / PX);
  // the scene is rendered with a margin so it can be rolled (motorcycle lean) without empty corners
  const th = 0.27;
  MX = Math.ceil((OW * (Math.cos(th) - 1) + OH * Math.sin(th)) / 2) + 2;
  MY = Math.ceil((OW * Math.sin(th) + OH * (Math.cos(th) - 1)) / 2) + 2;
  SWD = OW + 2 * MX; SHD = OH + 2 * MY;
  cv.width = OW; cv.height = OH;
  cv.style.width = OW * PX + 'px'; cv.style.height = OH * PX + 'px';
  img = ctx.createImageData(OW, OH);
  fb = new Uint32Array(img.data.buffer);
  colS = new Float32Array(SWD * SHD * 3); lb = new Float32Array(SWD * SHD * 3); refl = new Float32Array(SWD * SHD);
  colO = new Float32Array(OW * OH * 3);
  F = Math.max(OW * 0.62, OH * 0.8);
  HB = Math.round(OH * 0.45);
  HOR = MY + HB;
  PW = Math.round(F * 2 * Math.PI);
  useOut();

  // skyline panorama: two layers of towers
  const r = mulberry(99);
  function layer(minH, maxH, minW, maxW) {
    const L = { h: new Int16Array(PW), x0: new Int32Array(PW), seed: new Int32Array(PW), crown: [] };
    for (let x = 0; x < PW;) {
      const w = minW + Math.floor(r() * (maxW - minW)), h = Math.round(minH + Math.pow(r(), 1.5) * (maxH - minH));
      const sd = (r() * 1e6) | 0, cr = r() < 0.25 ? NEON[(r() * 6) | 0] : null;
      for (let i = 0; i < w && x + i < PW; i++) { L.h[x + i] = h; L.x0[x + i] = x; L.seed[x + i] = sd; L.crown[x + i] = cr; }
      x += w + (r() < 0.3 ? 1 + Math.floor(r() * 3) : 0);
    }
    return L;
  }
  sky1 = layer(HB * 0.15, HB * 0.85, 5, 16);
  sky2 = layer(HB * 0.08, HB * 0.45, 8, 22);
  holoX = Math.round(PW * 0.02);
  flyers = [];
  for (let i = 0; i < 14; i++) flyers.push({ pc: r() * PW, y: MY + HB * (0.12 + r() * 0.5), v: (r() < 0.5 ? -1 : 1) * (12 + r() * 40), c: NEON[(r() * 6) | 0] });

  // static cockpit overlay
  dmask = new Uint8Array(N); dcol = new Float32Array(N * 3);
  const set = (x, y, c) => { const i = y * W + x; dmask[i] = 1; dcol[i * 3] = c[0]; dcol[i * 3 + 1] = c[1]; dcol[i * 3 + 2] = c[2]; };
  const mw = Math.round(W * 0.17), mh = Math.max(6, Math.round(H * 0.065));
  const mx0 = Math.round(W / 2 - mw / 2), my0 = Math.round(roofAt(W / 2)) + 3;
  for (let y = 0; y < H; y++) {
    const pl = pillarAt(y);
    for (let x = 0; x < W; x++) {
      const dt = dashTopAt(x), rf = roofAt(x);
      if (y >= dt) {
        const k = (y - dt) / (H - dt);
        let c = mix([28, 22, 42], [8, 6, 14], Math.min(1, k * 1.6));
        if (y - dt < 1) c = [86, 60, 128];
        else if (hash(x, y, 4) < 0.08) c = mix(c, [0, 0, 0], 0.3);
        set(x, y, c);
      } else if (y < rf) {
        set(x, y, rf - y < 1 ? [52, 40, 76] : [10, 8, 16]);
      } else if (x < pl || x >= W - pl) {
        const edge = x < pl ? pl - x : x - (W - pl);
        set(x, y, edge < 1 ? [48, 36, 70] : [12, 9, 18]);
      } else if (x >= mx0 && x < mx0 + mw && y >= my0 && y < my0 + mh) {
        const bx = x === mx0 || x === mx0 + mw - 1 || y === my0 || y === my0 + mh - 1;
        const t = (y - my0) / mh;
        set(x, y, bx ? [20, 16, 28] : mix([40, 18, 60], [120, 40, 110], t));
      } else if (Math.abs(x - W / 2) < 1 && y >= rf && y < my0) {
        set(x, y, [20, 16, 28]);
      }
    }
  }
  // the mirror shows a pair of headlights far behind
  for (const sx of [-2, 2]) set(Math.round(W / 2 + sx), my0 + Math.round(mh * 0.62), [255, 240, 220]);

  // static motorcycle overlay: windscreen (tint), fairing, tank, mirrors; and the helmet visor frame
  bmask = new Uint8Array(N); bcol = new Float32Array(N * 3); vmask = new Uint8Array(N); vcol = new Float32Array(N * 3);
  const setB = (x, y, c, type) => {
    x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = y * W + x; bmask[i] = type; bcol[i * 3] = c[0]; bcol[i * 3 + 1] = c[1]; bcol[i * 3 + 2] = c[2];
  };
  const ws0 = Math.round(H * 0.67), ws1 = Math.round(H * 0.8);
  for (let y = ws0; y < ws1; y++) {
    const t = (y - ws0) / (ws1 - ws0), half = W * (0.1 + 0.07 * t);
    for (let x = Math.floor(W / 2 - half); x <= Math.ceil(W / 2 + half); x++) {
      const edge = Math.abs(x - W / 2) > half - 1 || y === ws0;
      setB(x, y, edge ? [70, 150, 190] : [6, 22, 34], edge ? 1 : 2);
    }
  }
  for (let y = ws1; y < H; y++) {
    const half = W * 0.17 + (y - ws1) * 0.7, t = (y - ws1) / (H - ws1);
    for (let x = Math.floor(W / 2 - half); x <= Math.ceil(W / 2 + half); x++)
      setB(x, y, y === ws1 || Math.abs(x - W / 2) > half - 1 ? [70, 56, 110] : mix([26, 22, 40], [10, 8, 16], t), 1);
  }
  const tcx = W / 2, tcy = H * 1.05, trx = W * 0.19, try_ = H * 0.15;
  for (let y = Math.floor(tcy - try_); y < H; y++) for (let x = Math.floor(tcx - trx); x <= tcx + trx; x++) {
    const nx = (x - tcx) / trx, ny = (y - tcy) / try_, e = nx * nx + ny * ny;
    if (e > 1) continue;
    let c = mix([34, 26, 52], [12, 10, 20], clamp(e, 0, 1));
    if (ny < -0.72 && ny > -0.82) c = [200, 40, 150];
    else if (ny < -0.6 && Math.abs(nx) < 0.5) c = mix(c, [120, 90, 170], 0.5);
    if (e > 0.94) c = [60, 46, 90];
    setB(x, y, c, 1);
  }
  for (const sd of [-1, 1]) {
    const mcx = W / 2 + sd * W * 0.34, mcy = H * 0.63, mrx = W * 0.07, mry = H * 0.05;
    const sx0 = W / 2 + sd * W * 0.27, sy0 = H * 0.8;
    for (let t = 0; t <= 1; t += 0.02) { setB(sx0 + (mcx - sx0) * t, sy0 + (mcy + mry - sy0) * t, [20, 18, 28], 1); setB(sx0 + (mcx - sx0) * t + 1, sy0 + (mcy + mry - sy0) * t, [36, 30, 48], 1); }
    for (let y = Math.floor(mcy - mry - 1); y <= mcy + mry + 1; y++) for (let x = Math.floor(mcx - mrx - 1); x <= mcx + mrx + 1; x++) {
      const e = ((x - mcx) / mrx) ** 2 + ((y - mcy) / mry) ** 2;
      if (e > 1.15) continue;

// ---------- state ----------
let T = 0, last = performance.now();

// ---------- simulation ----------
function rel(z) { return ((z - camZ) % LEN + LEN) % LEN; }

function update(dt) {

    speed += clamp(target - speed, -22 * dt, 9 * dt);

    steerT = clamp(want / latMax, -1, 1);
  } else {
    steerT = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (keys.gas) speed += (bike ? 17 : 11) * dt * (1 - 0.6 * speed / maxV());
    else if (keys.brake) speed -= 26 * dt;

  steer += (steerT - steer) * Math.min(1, dt * 6);

  px -= kappa * speed * speed * dt * 0.35;

  roll += (rollT - roll) * Math.min(1, dt * 4);

}

function wallTex(B, u, v, front, mpp) {

  }
  if (B.style === 6 && v >= 3.8) {                  // holo gardens: planted balconies on every floor

function drawWall(k, side, n) {

let PZ, PS, PCX, PGY;

function drawLamp(k, n, sg) {
  if (!projAt(k, 0)) return;

function drawBridge(k) {

function drawCar(c, k, dz) {

function drawCockpit() {

      putc(x, y, x === nx0 || y === ny0 || x === nx0 + nw - 1 || y === ny0 + nh - 1 ? [60, 30, 90] : [8, 10, 22]);
    let lx = 0, ldx = 0;
    for (let k = 0; k < DRAW; k++) {
      const n = (Math.floor(camZ / SEGL) + k) % NSEG;
      const sx = Math.round(nx0 + nw / 2 + lx * 0.12 - px * 0.12), sy = Math.round(ny0 + nh - 2 - k * (nh - 3) / DRAW);
      if (sx > nx0 && sx < nx0 + nw - 1) putc(sx, sy, k % 18 < 2 ? [255, 60, 200] : [0, 200, 255]);
      lx += ldx; ldx += curve[n];
    }
    putc(Math.round(nx0 + nw / 2), ny0 + nh - 2, [255, 255, 255]);
  }
  // steering wheel
  const a = steer * 0.9;
  for (let y = Math.max(0, Math.floor(cy - R - 3)); y < H; y++) for (let x = Math.floor(cx - R - 3); x <= cx + R + 3; x++) {
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
    if (Math.abs(d - R) > 2.4) continue;
    let ang = Math.atan2(dy, dx) - a + Math.PI / 2;
    ang = Math.atan2(Math.sin(ang), Math.cos(ang));
    let c = d < R - 0.8 ? [18, 15, 26] : d > R + 1.2 ? [12, 10, 18] : [40, 34, 56];
    if (Math.abs(ang) < 0.05) c = [0, 235, 255];
    putc(x, y, c);
  }
}

function drawGlass() {
  // rain streaks outside
  for (const s of streaks) {
    const cd = Math.abs(s.x - W / 2) / W + Math.abs(s.y - H * 0.42) / H;   // fainter near the centre of view
    const a = 0.09 * Math.min(1, cd * 2.5);
    if (a > 0.01) for (let k = 0; k < s.l; k++) addc(Math.round(s.x - steer * k * 0.3), Math.round(s.y - k), [130, 150, 200], a);
  }
  // droplets on the windshield refract what is behind them
  for (const d of drops) {
    const x = Math.round(d.x), y = Math.round(d.y);
    if (x < 1 || y < 3 || x >= W - 1 || y >= H - 1) continue;
    const j = (y * W + x) * 3;
    put(x, y, col[j] * 1.15 + 22, col[j + 1] * 1.15 + 24, col[j + 2] * 1.15 + 30);
    if (d.s === 2) { const k = ((y + 1) * W + x) * 3; put(x, y + 1, col[k] * 0.7, col[k + 1] * 0.7, col[k + 2] * 0.7); }
  }
  if (bike) return;
  // wiper
  const pvx = W * 0.62, pvy = dashTopAt(W * 0.62) + 1, ca = Math.cos(wAng), sa = Math.sin(wAng), L = H * 0.66;
  for (let t = 0; t < L; t += 0.5) {
    const x = Math.round(pvx + ca * t), y = Math.round(pvy + sa * t);
    putc(x, y, [6, 5, 10]); putc(x, y + 1, [6, 5, 10]);
  }
}

function thick(x0, y0, x1, y1, r, c, hi) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++)
      if (a * a + b * b <= r * r + 0.5) putc(Math.round(x + a), Math.round(y + b), b < -r * 0.4 ? hi : c);
  }
}

function drawBike() {
  for (let i = 0; i < N; i++) {
    const m = bmask[i]; if (!m) continue;
    const j = i * 3;
    if (m === 1) { col[j] = bcol[j]; col[j + 1] = bcol[j + 1]; col[j + 2] = bcol[j + 2]; }
    else { col[j] = col[j] * 0.7 + bcol[j]; col[j + 1] = col[j + 1] * 0.7 + bcol[j + 1]; col[j + 2] = col[j + 2] * 0.75 + bcol[j + 2]; }
  }
  // instrument screen
  const sw = Math.round(W * 0.15), sh = Math.round(H * 0.1), sx0 = Math.round(W / 2 - sw / 2), sy0 = Math.round(H * 0.8) + 2;
  for (let x = sx0; x < sx0 + sw; x++) for (let y = sy0; y < sy0 + sh && y < H; y++)
    putc(x, y, x === sx0 || x === sx0 + sw - 1 || y === sy0 || y === sy0 + sh - 1 ? [60, 40, 96] : [6, 8, 18]);
  const sc = H > 200 ? 2 : 1, kmh = String(Math.round(speed * 3.6)).padStart(3, ' ');
  text(kmh, Math.round(W / 2 - 6 * sc), sy0 + 4, [0, 235, 255], sc);
  text(auto ? 'AUTO' : 'MANUAL', Math.round(W / 2 - (auto ? 7 : 11)), sy0 + 6 + 5 * sc, auto ? [80, 255, 150] : [255, 150, 60], 1);
  const segs = 12, bw = Math.max(2, Math.floor((sw - 6) / segs));
  for (let i = 0; i < segs; i++) {
    const on = i < Math.round(speed / maxV() * segs), c = mix([0, 230, 255], [255, 40, 170], i / segs);
    for (let a = 0; a < bw - 1; a++) putc(Math.round(W / 2 - segs * bw / 2) + i * bw + a, sy0 + 2, on ? c : [30, 22, 44]);
  }
  // handlebars turn a little with the steering, gloved hands on the grips
  const a = steer * 0.07, pcx = W / 2, pcy = H * 0.87, r = Math.max(1, Math.round(H * 0.008));
  for (const sd of [-1, 1]) {
    const ex = W * 0.37 * sd, ey = -H * 0.075;
    const gx = pcx + ex * Math.cos(a) - ey * Math.sin(a), gy = pcy + ex * Math.sin(a) + ey * Math.cos(a);
    thick(pcx + sd * W * 0.05, pcy, gx, gy, r, [28, 26, 38], [80, 72, 104]);
    // a gloved fist wrapped around the grip: boxy back of the hand, four fingers curling under
    const grx = W * 0.055, gry = H * 0.065, stripe = sd < 0 ? [0, 230, 255] : [255, 50, 180];
    const gcx = gx - sd * grx * 0.15, gcy = gy - gry * 0.15;
    for (let y = Math.floor(gcy - gry - 1); y <= gcy + gry + 1; y++) for (let x = Math.floor(gcx - grx - 1); x <= gcx + grx + 1; x++) {
      const nx = (x - gcx) / grx, ny = (y - gcy) / gry, e = nx ** 4 + ny ** 4;
      if (e > 1) continue;
      let c;
      if (ny > 0.15) {                                   // fingers
        const f = Math.floor((nx * sd + 1) / 2 * 4), fx = ((nx * sd + 1) / 2 * 4) % 1;
        c = fx < 0.18 ? [8, 6, 12] : f === 3 ? [26, 22, 34] : mix([36, 32, 48], [16, 14, 22], (ny - 0.15) / 0.85);
      } else {                                           // back of the hand
        c = mix([44, 40, 58], [26, 22, 36], clamp(ny + 1, 0, 1));
        if (ny > -0.2 && ny < 0.02) c = stripe;          // neon knuckle strip
        else if (ny < -0.7) c = [64, 58, 84];
      }
      if (e > 0.82) c = [8, 6, 12];
      putc(x, y, c);
    }
  }
  // helmet visor frame
  for (let i = 0; i < N; i++) if (vmask[i]) { const j = i * 3; col[j] = vcol[j]; col[j + 1] = vcol[j + 1]; col[j + 2] = vcol[j + 2]; }
}

function render() {
  useScene();
  lb.fill(0); refl.fill(0);
  const base = Math.floor(camZ / SEGL), frac = camZ / SEGL - base;
  const b0 = base % NSEG, b1 = (base + 1) % NSEG;
  const camY = hill[b0] + (hill[b1] - hill[b0]) * frac + eye() + Math.sin(camZ * 0.9) * 0.015 * Math.min(1, speed / 20);
  const sh = shake * 3, hy = HOR + (Math.random() - 0.5) * sh;
  const camX = px + (Math.random() - 0.5) * shake * 0.4;
  {
    const z = zoneAt(base), a = CITIES[z[3]];
    if (z[2] === 5) {
      const b = CITIES[(z[3] + 1) % CITIES.length], t = smooth(0.25, 0.85, (base - z[0]) / (z[1] - z[0]));
      FOG = mix(a.fog, b.fog, t); SKY = [0, 1, 2].map(i => mix(a.sky[i], b.sky[i], t)); TWC = [0, 1].map(i => mix(a.tw[i], b.tw[i], t));
    } else { FOG = a.fog; SKY = a.sky; TWC = a.tw; }
  }

  let x = 0, dx = -curve[b0] * frac;
  for (let k = 0; k <= DRAW; k++) {
    const n = (base + k) % NSEG;
    const z = Math.max(NEAR, (k - frac) * SEGL);
    Z[k] = z; S[k] = F / z;
    CX[k] = W / 2 + (x - camX) * S[k];
    GY[k] = hy - (hill[n] - camY) * S[k];
    x += dx; dx += curve[n];
  }

  drawSky(hy);

  // traffic sorted into segments
  const buckets = new Map();
  for (const c of cars) {
    const r = rel(c.z), k = Math.floor(r / SEGL + frac);
    if (k < 0 || k >= DRAW || r < NEAR) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push({ c, r });
  }
  for (const p of peds) {
    const r = rel(p.z), k = Math.floor(r / SEGL + frac);
    if (k < 0 || k >= DRAW || r < NEAR || district(Math.floor(p.z / SEGL)) === 3) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push({ p, r });
  }

  for (let k = DRAW - 1; k >= 0; k--) {
    const n = (base + k) % NSEG;
    const d = district(n);
    drawGround(k, d);
    if (d === 5) {
      drawSkybridge(k, n);
    } else if (d === 3) {
      drawTunnel(k, n);
      if (k > 0 && TUNNEL_STARTS.includes(n)) drawPortal(k);
    } else {
      drawWall(k, 0, n);
      drawWall(k, 1, n);
      if (d === 1 && n % 2 === 0) for (const sg of [-1, 1]) if (hash(n, sg + 5, 31) < 0.45) drawStall(k, sg, n);
      if (n % 9 === 0 && d !== 1 && d !== 6) { drawLamp(k, n, -1); drawLamp(k, n, 1); }
      if (d === 4) {
        if (n % 3 === 0) for (const sg of [-1, 1]) if (hash(n, sg + 9, 41) < 0.6) drawContainers(k, sg, n);
        if (n % 45 === 20) drawCrane(k, hash(n, 2, 43) < 0.5 ? -1 : 1, n);
      }
      if (d === 6 && n % 2 === 1) for (const sg of [-1, 1]) drawTree(k, sg, n);
      if (d !== 1 && d !== 6 && hash(n, 7, 77) < 0.05) drawSteam(k, hash(n, 8, 78) < 0.5 ? -3.5 : 3.5, 0, n, 1);
    }
    const bk = buckets.get(k);
    if (bk) {
      bk.sort((a, b) => b.r - a.r);
      for (const o of bk) { if (o.c) drawCar(o.c, k, o.r - Z[k]); else drawPed(o.p, k, o.r - Z[k]); }
    }
    if (d === 0 || d === 2) drawMonorail(k, n);
    if (d === 0 && n % 7 === 3) drawWires(k, n);
    if (d === 1 && n % 3 === 0) drawLanterns(k, n);
    if ((d === 0 || d === 2) && n % 170 === 85) drawBridge(k);
    if (d !== 3 && d !== 5 && n % 300 === 150) drawKoi(k, n);
    if (d === 5 && n === zoneAt(n)[0] + 4) drawGantry(k, CITIES[(zoneAt(n)[3] + 1) % CITIES.length]);
    if (d !== 5 && d !== 3 && n === zoneAt(n)[0] + 2 && zoneAt(n - 3)[2] === 5) drawGantry(k, CITIES[zoneAt(n)[3]]);
  }

  addLight(W / 2, hy + eye() * F / 14, Math.min(30, F * 2.4 / 14), [190, 215, 255], bike ? 0.22 : 0.28);

  // glow, then wet-road reflections of everything above the horizon
  for (let i = 0; i < N * 3; i++) col[i] += lb[i];
  const hr = Math.round(hy);
  for (let y = hr + 1; y < H; y++) {
    const ys = 2 * hr - y; if (ys < 0) break;
    const wob = Math.round(Math.sin(y * 0.9 + T * 5) * 0.6);
    for (let x = 0; x < W; x++) {
      const i = y * W + x, k = refl[i]; if (!k) continue;
      const xs = clamp(x + wob, 0, W - 1), j = (ys * W + xs) * 3, o = i * 3;
      const lum = col[j] * 0.3 + col[j + 1] * 0.5 + col[j + 2] * 0.2, kk = k * 0.55 * smooth(70, 190, lum);
      if (kk <= 0.01) continue;
      col[o] += (col[j] - col[o]) * kk; col[o + 1] += (col[j + 1] - col[o + 1]) * kk; col[o + 2] += (col[j + 2] - col[o + 2]) * kk;
    }
  }

  // roll the scene (motorcycle lean) into the output buffer
  {
    const ca = Math.cos(roll), sa = Math.sin(roll), pcx = OW / 2, pcy = OH / 2, scx = SWD / 2, scy = SHD / 2, src = colS, dst = colO;
    for (let oy = 0, o = 0; oy < OH; oy++) {
      const dy = oy + 0.5 - pcy;
      for (let ox = 0; ox < OW; ox++, o += 3) {
        const dx = ox + 0.5 - pcx;
        const sx = clamp(Math.floor(ca * dx - sa * dy + scx), 0, SWD - 1), sy = clamp(Math.floor(sa * dx + ca * dy + scy), 0, SHD - 1);
        const j = (sy * SWD + sx) * 3;
        dst[o] = src[j]; dst[o + 1] = src[j + 1]; dst[o + 2] = src[j + 2];
      }
    }
  }
  useOut();
  drawGlass();
  if (bike) drawBike(); else drawCockpit();

  const fl = crashFlash * 120;
  for (let i = 0, j = 0; i < N; i++, j += 3) {
    let r = col[j] + fl, g = col[j + 1] + fl * 0.3, b = col[j + 2] + fl * 0.4;
    r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; b = b > 255 ? 255 : b | 0;
    fb[i] = (255 << 24) | (b << 16) | (g << 8) | r;
  }
  ctx.putImageData(img, 0, 0);
}

let perfT = 0, perfN = 0, perfDone = false, hdChosen = false;
function frame(now) {
  const rawDt = (now - last) / 1000;
  const dt = Math.min(0.05, rawDt); last = now;
  if (!perfDone && !hdChosen && T > 1.5) {          // after warming up, measure ~3 s; fall back if under ~32 fps
    perfT += rawDt; perfN++;
    if (perfT > 3) { perfDone = true; if (hd && perfN / perfT < 32) setHD(false); }
  }
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---------- input ----------
const btnA = document.getElementById('ba');
function setAuto(on) {
  auto = on; idle = 0;
  if (on) autoLane = px < 3.5 ? 1.75 : 5.25;
  btnA.classList.toggle('on', on);
}
function manual() { if (auto) setAuto(false); idle = 0; }
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'gas', ArrowDown: 'brake' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; manual(); e.preventDefault(); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!auto);
  else if (e.key === 'r' || e.key === 'R') toggleRain();
  else if (e.key === 'v' || e.key === 'V') toggleVehicle();
  else if (e.key === 'h' || e.key === 'H') { hdChosen = true; setHD(!hd); }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
function hold(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); manual(); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
hold('bl', 'left'); hold('br', 'right'); hold('bg', 'gas'); hold('bb', 'brake');
btnA.addEventListener('pointerdown', e => { e.preventDefault(); setAuto(!auto); });
const btnV = document.getElementById('bv');
function toggleVehicle() { bike = !bike; roll = 0; drops = []; btnV.textContent = bike ? 'CAR' : 'BIKE'; }
btnV.addEventListener('pointerdown', e => { e.preventDefault(); toggleVehicle(); });
const btnR = document.getElementById('br2');
function toggleRain() { rainOn = !rainOn; if (!rainOn) drops = []; btnR.classList.toggle('on', rainOn); }
btnR.addEventListener('pointerdown', e => { e.preventDefault(); toggleRain(); });
const btnQ = document.getElementById('bq');
function setHD(on) { hd = on; btnQ.classList.toggle('on', on); drops = []; streaks = []; setup(); }
btnQ.addEventListener('pointerdown', e => { e.preventDefault(); hdChosen = true; setHD(!hd); });
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 9000);

requestAnimationFrame(frame);
</script>
</body>
