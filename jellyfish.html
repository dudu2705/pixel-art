<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Jelly</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const out = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
resize();
addEventListener('resize', () => {
  resize();
  resizeLow();
});

const S = Math.max(0.6, Math.min(W, H) / 900);   // world scale, fixed at start
const STEP = 1 / 120;
const SIZE = 1.6;   // creature scale

// ---------- Creature body (mushroom cap = jelly bell) ----------
const J = {
  x: W * 0.5, y: H * 0.45, vx: 0, vy: 0,
  a: 0,                 // heading; forward = (sin a, -cos a)
  phase: 0, period: 1.2,
  c: 0, rate: 0,        // contraction 0..1 and its rate (1/s)
  bw0: 62 * S * SIZE, bh0: 72 * S * SIZE, bw: 62 * S * SIZE, bh: 72 * S * SIZE,
  wantA: 0, retarget: 4,
};
const cam = { x: J.x - W / 2, y: J.y - H / 2 };   // camera follows the creature through open space
let fx = 0, fy = -1, rx = 1, ry = 0; // forward and right unit vectors

function contraction(p) {
  // Fast power stroke (~30% of cycle), slow elastic recovery
  if (p < 0.3) return 0.5 - 0.5 * Math.cos(Math.PI * p / 0.3);
  const q = (p - 0.3) / 0.7;
  return Math.pow(1 - q, 1.6) * (0.5 + 0.5 * Math.cos(Math.PI * q));
}

function localToWorld(lx, ly) {
  // local -y is forward, +x is right
  return [J.x + rx * lx - fx * ly, J.y + ry * lx - fy * ly];
}

// ---------- Tentacles ----------
const tentacles = [];
function makeStrand(kind, count, segLen, anchorFn, opts) {
  const pts = [];
  const [ax, ay] = anchorFn();
  for (let i = 0; i < count; i++) {
    const x = ax + (Math.random() - 0.5) * 0.5, y = ay + i * segLen;
    pts.push({ x, y, px: x, py: y });
  }
  tentacles.push(Object.assign({ kind, pts, L: segLen, anchorFn }, opts));
}

const NT = 18;
for (let i = 0; i < NT; i++) {
  // Rim is a circle seen edge-on: project angle around the rim onto the side view
  const th = (i + 0.5) / NT * Math.PI * 2;
  const len = 46 + Math.floor(Math.random() * 14);
  makeStrand('tentacle', len, 7.5 * S * SIZE, () => {
    const lx = J.bw * 0.94 * Math.cos(th);
    const ly = J.bh * 0.05 * Math.sin(th);
    return localToWorld(lx, ly);
  }, {
    drag: 3.2, stiff: 0.85, bendMin: 0.78, bendK: 0.3,
    depth: Math.sin(th), glow: Math.random() * 6.28,
  });
}
const NA = 5;
for (let i = 0; i < NA; i++) {
  const off = (i / (NA - 1) - 0.5) * 0.35;
  // root-like arms hang from the bottom of the stem
  makeStrand('arm', 30, 7 * S * SIZE, () => localToWorld(J.bw * off, J.bh * 0.55), {
    drag: 2.4, stiff: 1, bendMin: 0.8, bendK: 0.2,
    width: 6 * S * SIZE, armPhase: Math.random() * 6.28,
  });
}

// ---------- Ether flow ----------
let time = 0;

function flow(x, y, out) {
  const t = time;
  // gentle drifting cosmic current
  let ux = 7 * S * Math.sin(y * 0.004 / S + t * 0.3) + 4 * S * Math.sin((x + y) * 0.007 / S - t * 0.5);
  let uy = 5 * S * Math.cos(x * 0.005 / S + t * 0.25) + 3 * S * Math.sin((x - y) * 0.006 / S + t * 0.4);

  // bell wake: jet behind on power stroke, refill inflow on recovery
  const dx = x - J.x, dy = y - J.y;
  const al = dx * fx + dy * fy;       // along heading (negative = behind)
  const lat = dx * rx + dy * ry;      // sideways
  if (al < J.bh * 0.3) {
    const behind = Math.max(0, -al);
    const g = Math.exp(-(lat * lat) / (J.bw * J.bw * 1.8)) * Math.exp(-behind / (J.bh * 3.2));
    if (J.rate > 0) {
      const s = -J.rate * 90 * S * g;
      ux += fx * s; uy += fy * s;
      const sp = J.rate * 18 * S * g * Math.sign(lat);
      ux += rx * sp; uy += ry * sp;
    } else {
      const s = -J.rate * 22 * S * g;
      ux += fx * s; uy += fy * s;
      const sp = -s * 0.8 * Math.sign(lat) * Math.min(1, Math.abs(lat) / J.bw);
      ux += rx * sp; uy += ry * sp;
    }
  }
  out[0] = ux; out[1] = uy;
}

// ---------- Simulation ----------
const tmp = [0, 0];
function wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

// Tentacles are long, so turns must be wide: the turn radius is never smaller
// than about half a tentacle length, which keeps the tail trailing behind.
const TLEN = 53 * 7.5 * S * SIZE;
function wander() {
  J.wantA = J.a + (Math.random() * 2 - 1) * 0.9;
  J.retarget = 3 + Math.random() * 3;
}

function stepCamera(dt) {
  const lead = 120 * S * SIZE;
  const k = 1 - Math.exp(-0.8 * dt);
  cam.x += (J.x + fx * lead - W / 2 - cam.x) * k;
  cam.y += (J.y + fy * lead - H / 2 - cam.y) * k;
  const m = Math.min(W, H) * 0.2;
  if (J.x - cam.x < m) cam.x = J.x - m;
  if (J.x - cam.x > W - m) cam.x = J.x - (W - m);
  if (J.y - cam.y < m) cam.y = J.y - m;
  if (J.y - cam.y > H - m) cam.y = J.y - (H - m);
}

function stepBody(dt) {
  J.phase += dt / J.period;
  if (J.phase >= 1) { J.phase -= 1; J.period = 1.0 + Math.random() * 0.4; }
  const c = contraction(J.phase);
  J.rate = (c - J.c) / dt;
  J.c = c;
  J.bw = J.bw0 * (1 - 0.3 * c);
  J.bh = J.bh0 * (1 + 0.12 * c);

  // wander in a random direction, never sharper than the tail allows
  J.retarget -= dt;
  if (J.retarget < 0) wander();
  const diff = wrapAngle(J.wantA - J.a);
  const maxTurn = 0.05 + Math.hypot(J.vx, J.vy) / (TLEN * 0.55);
  J.a += Math.max(-maxTurn, Math.min(maxTurn, diff * 1.2)) * dt;

  fx = Math.sin(J.a); fy = -Math.cos(J.a);
  rx = Math.cos(J.a); ry = Math.sin(J.a);

  if (J.rate > 0) {
    const k = 300 * S * J.rate * dt;
    J.vx += fx * k; J.vy += fy * k;
  }
  const d = Math.exp(-1.5 * dt);
  J.vx *= d; J.vy *= d;

  flow(J.x, J.y, tmp);
  J.x += (J.vx + tmp[0] * 0.4) * dt;
  J.y += (J.vy + tmp[1] * 0.4) * dt;

  // release glowing spores from the gills on each power stroke
  if (J.rate > 0.5 && Math.random() < dt * 10) {
    const [sx, sy] = localToWorld((Math.random() - 0.5) * J.bw * 1.4, -J.bh * 0.05);
    const sp = (15 + Math.random() * 20) * S;
    spores.push({ x: sx, y: sy, vx: -fx * sp + (Math.random() - 0.5) * 10 * S, vy: -fy * sp + (Math.random() - 0.5) * 10 * S, life: 0, max: 3 + Math.random() * 3 });
  }
}

function stepStrands(dt) {
  for (const T of tentacles) {
    const pts = T.pts, n = pts.length;
    const df = Math.exp(-T.drag * dt);

    const [ax, ay] = T.anchorFn();
    pts[0].px = pts[0].x; pts[0].py = pts[0].y;
    pts[0].x = ax; pts[0].y = ay;

    // Verlet integrate with drag relative to the local flow
    for (let i = 1; i < n; i++) {
      const p = pts[i];
      flow(p.x, p.y, tmp);
      const wx = tmp[0] * dt, wy = tmp[1] * dt;
      const tipDf = Math.pow(df, 1 + 0.8 * i / n);
      const vx = wx + (p.x - p.px - wx) * tipDf;
      const vy = wy + (p.y - p.py - wy) * tipDf;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy;
    }

    const L = T.L;
    for (let it = 0; it < 5; it++) {
      for (let i = 0; i < n - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        const k = (dist - L) / dist * T.stiff;
        if (i === 0) { b.x -= dx * k; b.y -= dy * k; }
        else { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; }
      }
      // soft one-sided bending: resist only sharp kinks, allow natural curls
      const minD = L * 2 * T.bendMin;
      for (let i = 0; i < n - 2; i++) {
        const a = pts[i], b = pts[i + 2];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        if (dist < minD) {
          const k = (dist - minD) / dist * T.bendK;
          if (i === 0) { b.x -= dx * k; b.y -= dy * k; }
          else { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; }
        }
      }
    }

    // tentacle tension tugs the body slightly (drag feedback)
    const p0 = pts[0], p1 = pts[1];
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const stretch = dist - L;
    if (stretch > 0) {
      const k = stretch * (T.kind === 'arm' ? 30 : 14) * dt / dist;
      J.vx += dx * k; J.vy += dy * k;
    }
  }
}

// ---------- Space dust, spores, stars ----------
const dust = [];
for (let i = 0; i < 110; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 0.7 });
function stepDust(dt) {
  for (const s of dust) {
    flow(s.x, s.y, tmp);
    s.x += (tmp[0] + 4 * S) * dt * s.z;
    s.y += tmp[1] * dt * s.z;
    if (s.x - cam.x < -10) s.x += W + 20; if (s.x - cam.x > W + 10) s.x -= W + 20;
    if (s.y - cam.y < -10) s.y += H + 20; if (s.y - cam.y > H + 10) s.y -= H + 20;
  }
}

const spores = [];
function stepSpores(dt) {
  for (let i = spores.length - 1; i >= 0; i--) {
    const s = spores[i];
    s.life += dt;
    if (s.life > s.max) { spores.splice(i, 1); continue; }
    flow(s.x, s.y, tmp);
    const d = Math.exp(-1.2 * dt);
    s.vx = tmp[0] + (s.vx - tmp[0]) * d;
    s.vy = tmp[1] + (s.vy - tmp[1]) * d;
    s.x += s.vx * dt; s.y += s.vy * dt;
  }
}

const stars = [];
for (let i = 0; i < 260; i++) {
  stars.push({ u: Math.random(), v: Math.random(), b: Math.random(), sp: 0.5 + Math.random() * 2.5, ph: Math.random() * 6.28, big: Math.random() < 0.05 });
}

const planets = [
  { u: 0.84, v: 0.8, r: 0.24, dark: '#3b2160', mid: '#6a3a9a', light: '#a066d0', ring: true, bands: true, tilt: -0.32, p: 0.35 },
  { u: 0.13, v: 0.18, r: 0.075, dark: '#5a2a1a', mid: '#b4582a', light: '#f09a4a', craters: true, p: 0.2 },
  { u: 0.27, v: 0.88, r: 0.04, dark: '#1d5b5a', mid: '#3fa39a', light: '#9fe3d6', p: 0.25 },
  { u: 0.64, v: 0.1, r: 0.018, dark: '#1b3a8a', mid: '#6fb8ff', light: '#e6f6ff', p: 0.08 },
];

// ---------- Rendering (pixel art) ----------
const PX = Math.max(3, Math.round(4 * S));       // screen pixels per art pixel
const low = document.createElement('canvas');
const ctx = low.getContext('2d', { willReadFrequently: true });
let LW, LH;
function resizeLow() { LW = Math.ceil(W / PX); LH = Math.ceil(H / PX); low.width = LW; low.height = LH; }
resizeLow();

const PALETTE = [
  '#02030a', '#070a1c', '#0e1430', '#1a1f4a',
  '#1b3a8a', '#2a5fd0', '#3f8cff', '#6fb8ff', '#a8dcff', '#e6f6ff', '#4fe3ff',
  '#3b2160', '#6a3a9a', '#a066d0',
  '#5a2a1a', '#b4582a', '#f09a4a',
  '#1d5b5a', '#3fa39a', '#9fe3d6',
].map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

function quantize() {
  const img = ctx.getImageData(0, 0, LW, LH), d = img.data;
  for (let y = 0; y < LH; y++) {
    for (let x = 0; x < LW; x++) {
      const i = (y * LW + x) * 4;
      const t = (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.47) * 24;
      const r = d[i] + t, g = d[i + 1] + t, b = d[i + 2] + t;
      let best = 0, bd = 1e12;
      for (let k = 0; k < PALETTE.length; k++) {
        const p = PALETTE[k];
        const dr = r - p[0], dg = g - p[1], db = b - p[2];
        const dd = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
        if (dd < bd) { bd = dd; best = k; }
      }
      const p = PALETTE[best];
      d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

let CX = 0, CY = 0;   // camera snapped to whole art pixels (no shimmer)
function mod(a, b) { return ((a % b) + b) % b; }
function screenSpace() { ctx.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0); }
function worldSpace() { ctx.setTransform(1 / PX, 0, 0, 1 / PX, -CX / PX, -CY / PX); }
function pixelSpace() { ctx.setTransform(1, 0, 0, 1, 0, 0); }

function plotLine(x0, y0, x1, y1) {
  x0 = Math.floor((x0 - CX) / PX); y0 = Math.floor((y0 - CY) / PX);
  x1 = Math.floor((x1 - CX) / PX); y1 = Math.floor((y1 - CY) / PX);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function drawSpace() {
  screenSpace();
  ctx.fillStyle = '#04061a';
  ctx.fillRect(0, 0, W, H);

  // nebula haze
  const neb = [
    [0.3, 0.4, 0.55, 'rgba(42,95,208,0.20)'],
    [0.7, 0.3, 0.45, 'rgba(106,58,154,0.16)'],
    [0.5, 0.75, 0.4, 'rgba(27,58,138,0.18)'],
  ];
  for (const [u, v, r, col] of neb) {
    const R = r * Math.max(W, H);
    const x = mod(u * W - CX * 0.02, W * 1.6) - W * 0.3, y = mod(v * H - CY * 0.02, H * 1.6) - H * 0.3;
    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  pixelSpace();
  for (const s of stars) {
    const b = s.b * 0.75 + 0.25 * Math.sin(time * s.sp + s.ph);
    if (b < 0.15) continue;
    const p = 0.03 + s.b * 0.12;   // parallax: brighter stars feel closer
    const x = Math.floor(mod(s.u * LW - CX / PX * p, LW)), y = Math.floor(mod(s.v * LH - CY / PX * p, LH));
    ctx.fillStyle = b > 0.8 ? '#e6f6ff' : b > 0.55 ? '#a8dcff' : b > 0.35 ? '#6fb8ff' : '#2a5fd0';
    ctx.fillRect(x, y, 1, 1);
    if (s.big && b > 0.6) {
      ctx.fillStyle = '#6fb8ff';
      ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1);
      ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1);
    }
  }
}

function drawRing(P, cx, cy, R, front) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(P.tilt);
  ctx.lineWidth = R * 0.14;
  ctx.strokeStyle = 'rgba(160,102,208,0.85)';
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 1.85, R * 0.42, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = R * 0.05;
  ctx.strokeStyle = 'rgba(230,246,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, R * 1.55, R * 0.34, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawPlanet(P) {
  screenSpace();
  const R = P.r * Math.min(W, H);
  // parallax scroll, wrapping so planets drift by again as it travels
  const pad = R * 2.2;
  const cx = mod(P.u * W - CX * P.p + pad, W * 1.7 + pad * 2) - pad;
  const cy = mod(P.v * H - CY * P.p + pad, H * 1.7 + pad * 2) - pad;
  if (P.ring) drawRing(P, cx, cy, R, false);

  // atmosphere glow
  ctx.globalCompositeOperation = 'lighter';
  const ag = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.35);
  ag.addColorStop(0, 'rgba(111,184,255,0.18)');
  ag.addColorStop(1, 'rgba(111,184,255,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.35, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // body, lit from upper-left
  const g = ctx.createRadialGradient(cx - R * 0.45, cy - R * 0.45, R * 0.05, cx - R * 0.1, cy - R * 0.1, R * 1.25);
  g.addColorStop(0, P.light);
  g.addColorStop(0.45, P.mid);
  g.addColorStop(0.85, P.dark);
  g.addColorStop(1, '#070a1c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.clip();
  if (P.bands) {
    for (let i = 0; i < 7; i++) {
      const y = cy - R + (i + 0.5) * R * 2 / 7 + Math.sin(time * 0.2 + i) * R * 0.03;
      ctx.fillStyle = i % 2 ? 'rgba(59,33,96,0.35)' : 'rgba(160,102,208,0.22)';
      ctx.beginPath();
      ctx.ellipse(cx, y, R * 1.1, R * 0.09, 0, 0, 6.283);
      ctx.fill();
    }
  }
  if (P.craters) {
    ctx.fillStyle = 'rgba(90,42,26,0.55)';
    for (const [u, v, r] of [[-0.3, -0.2, 0.18], [0.25, 0.3, 0.14], [0.1, -0.45, 0.1], [-0.4, 0.35, 0.09]]) {
      ctx.beginPath(); ctx.arc(cx + u * R, cy + v * R, r * R, 0, 6.283); ctx.fill();
    }
  }
  // night side shadow
  const sh = ctx.createRadialGradient(cx - R * 0.6, cy - R * 0.6, R * 0.6, cx - R * 0.6, cy - R * 0.6, R * 2.2);
  sh.addColorStop(0, 'rgba(4,6,26,0)');
  sh.addColorStop(1, 'rgba(4,6,26,0.85)');
  ctx.fillStyle = sh;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.restore();

  if (P.ring) drawRing(P, cx, cy, R, true);
}

function drawParticles() {
  pixelSpace();
  for (const s of dust) {
    ctx.fillStyle = s.z > 0.8 ? '#3f8cff' : '#1b3a8a';
    ctx.fillRect(Math.floor((s.x - CX) / PX), Math.floor((s.y - CY) / PX), 1, 1);
  }
  for (const s of spores) {
    const f = s.life / s.max;
    ctx.fillStyle = f < 0.3 ? '#e6f6ff' : f < 0.6 ? '#4fe3ff' : f < 0.85 ? '#3f8cff' : '#1b3a8a';
    ctx.fillRect(Math.floor((s.x - CX) / PX), Math.floor((s.y - CY) / PX), 1, 1);
  }
}

const FRONT_COLORS = ['#e6f6ff', '#a8dcff', '#6fb8ff', '#3f8cff', '#2a5fd0', '#1b3a8a'];
const BACK_COLORS = ['#3f8cff', '#2a5fd0', '#2a5fd0', '#1b3a8a', '#1b3a8a', '#1a1f4a'];

function drawTentacle(T, back) {
  if ((T.depth > 0) !== back) return;
  pixelSpace();
  const pts = T.pts, n = pts.length;
  const cols = back ? BACK_COLORS : FRONT_COLORS;
  for (let i = 0; i < n - 1; i++) {
    ctx.fillStyle = cols[Math.min(cols.length - 1, Math.floor(i / (n - 1) * cols.length))];
    plotLine(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
  }
  // bioluminescent tip
  if (Math.sin(time * 2.2 + T.glow) > -0.2) {
    const tip = pts[n - 1];
    ctx.fillStyle = back ? '#3f8cff' : '#4fe3ff';
    ctx.fillRect(Math.floor((tip.x - CX) / PX), Math.floor((tip.y - CY) / PX), 1, 1);
  }
}

function drawArm(T) {
  worldSpace();
  const pts = T.pts, n = pts.length;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const u = i / (n - 1);
    const frill = 1 + 0.4 * Math.sin(i * 1.25 + time * 2.2 + T.armPhase);
    const w = T.width * Math.pow(1 - u, 0.9) * frill * 0.5 + 0.5 * S;
    left.push([pts[i].x - ty * w, pts[i].y + tx * w]);
    right.push([pts[i].x + ty * w, pts[i].y - tx * w]);
  }
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(42,95,208,0.75)';
  ctx.fill();
  ctx.lineWidth = PX;
  ctx.strokeStyle = 'rgba(111,184,255,0.85)';
  ctx.stroke();
}

const SPOTS = [[-0.45, -0.72, 0.13], [0.1, -0.88, 0.11], [0.52, -0.58, 0.12], [-0.12, -0.5, 0.09], [0.25, -0.3, 0.08], [-0.68, -0.32, 0.08], [0.75, -0.2, 0.06], [-0.3, -0.18, 0.06]];

function drawCreature() {
  worldSpace();
  const bw = J.bw, bh = J.bh, c = J.c;
  ctx.translate(J.x, J.y);
  ctx.rotate(J.a);

  // glow aura
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(0, -bh * 0.4, 0, 0, -bh * 0.4, bw * 2.4);
  glow.addColorStop(0, `rgba(63,140,255,${0.28 + 0.12 * c})`);
  glow.addColorStop(1, 'rgba(63,140,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, -bh * 0.4, bw * 2.4, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  const flare = (1 - c) * 0.08;
  const sub = bh * (0.22 + 0.1 * c);
  const rimX = bw * (1 + flare), rimY = bh * 0.04;

  // stem with ring (annulus), behind the cap's underside
  const stemTop = -sub * 0.5, stemBot = bh * 0.55;
  const sw = bw * 0.16;
  const sg = ctx.createLinearGradient(-sw, 0, sw, 0);
  sg.addColorStop(0, '#a8dcff');
  sg.addColorStop(0.5, '#6fb8ff');
  sg.addColorStop(1, '#2a5fd0');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(-sw * 0.8, stemTop);
  ctx.quadraticCurveTo(-sw * 1.1, (stemTop + stemBot) * 0.5, -sw * 1.25, stemBot);
  ctx.quadraticCurveTo(0, stemBot + bh * 0.1, sw * 1.25, stemBot);
  ctx.quadraticCurveTo(sw * 1.1, (stemTop + stemBot) * 0.5, sw * 0.8, stemTop);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = PX;
  ctx.strokeStyle = '#1b3a8a';
  ctx.stroke();
  // ring skirt
  const ry0 = bh * 0.12;
  ctx.fillStyle = '#a8dcff';
  ctx.beginPath();
  ctx.moveTo(-sw * 1.05, ry0);
  ctx.quadraticCurveTo(-sw * 2.1, ry0 + bh * 0.12, -sw * 1.7, ry0 + bh * 0.16);
  for (let i = 0; i <= 6; i++) {
    const x = -sw * 1.7 + (i / 6) * sw * 3.4;
    ctx.lineTo(x, ry0 + bh * (0.16 + (i % 2) * 0.035));
  }
  ctx.quadraticCurveTo(sw * 2.1, ry0 + bh * 0.12, sw * 1.05, ry0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2a5fd0';
  ctx.stroke();

  // gills: underside of the cap
  ctx.beginPath();
  ctx.moveTo(-rimX, rimY);
  ctx.quadraticCurveTo(0, -sub, rimX, rimY);
  ctx.quadraticCurveTo(0, rimY + bh * 0.05, -rimX, rimY);
  ctx.closePath();
  ctx.fillStyle = '#1b3a8a';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = '#6fb8ff';
  ctx.lineWidth = PX * 0.8;
  for (let i = 0; i <= 12; i++) {
    const x = (-1 + i / 6) * rimX;
    ctx.beginPath(); ctx.moveTo(0, -sub * 0.6); ctx.lineTo(x, rimY + bh * 0.05); ctx.stroke();
  }
  ctx.restore();

  // cap
  ctx.beginPath();
  ctx.moveTo(-rimX, rimY);
  ctx.bezierCurveTo(-bw * 1.04, -bh * 0.72, -bw * 0.62, -bh, 0, -bh);
  ctx.bezierCurveTo(bw * 0.62, -bh, bw * 1.04, -bh * 0.72, rimX, rimY);
  ctx.quadraticCurveTo(0, -sub, -rimX, rimY);
  ctx.closePath();
  const g = ctx.createRadialGradient(-bw * 0.35, -bh * 0.8, bw * 0.05, 0, -bh * 0.4, bw * 1.25);
  g.addColorStop(0, '#e6f6ff');
  g.addColorStop(0.3, '#6fb8ff');
  g.addColorStop(0.65, '#3f8cff');
  g.addColorStop(1, '#1b3a8a');
  ctx.fillStyle = g;
  ctx.globalAlpha = 0.93;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = PX;
  ctx.strokeStyle = '#a8dcff';
  ctx.stroke();

  ctx.save();
  ctx.clip();
  const pulse = 0.75 + 0.25 * Math.sin(time * 1.5);
  for (const [u, v, r] of SPOTS) {
    ctx.fillStyle = `rgba(230,246,255,${0.9 * pulse})`;
    ctx.beginPath();
    ctx.ellipse(u * bw, v * bh, r * bw * 1.1, r * bw * 0.9, 0, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  // wavy rim edge
  ctx.strokeStyle = '#e6f6ff';
  ctx.lineWidth = PX;
  ctx.beginPath();
  const lobes = 10;
  for (let i = 0; i <= lobes; i++) {
    const u = i / lobes, x = (-1 + 2 * u) * rimX;
    const y = rimY - Math.sin(u * Math.PI) * sub * 0.95 + (i % 2) * PX;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function render() {
  CX = Math.round(cam.x / PX) * PX; CY = Math.round(cam.y / PX) * PX;
  drawSpace();
  for (const P of planets) drawPlanet(P);
  drawParticles();
  for (const T of tentacles) if (T.kind === 'tentacle') drawTentacle(T, true);
  for (const T of tentacles) if (T.kind === 'arm') drawArm(T);
  drawCreature();
  for (const T of tentacles) if (T.kind === 'tentacle') drawTentacle(T, false);
  pixelSpace();
  quantize();

  out.setTransform(1, 0, 0, 1, 0, 0);
  out.imageSmoothingEnabled = false;
  out.drawImage(low, 0, 0, LW * PX * DPR, LH * PX * DPR);
}

// ---------- Loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    time += STEP;
    stepBody(STEP);
    stepStrands(STEP);
    stepDust(STEP);
    stepSpores(STEP);
    stepCamera(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// warm up so tentacles start settled
for (let i = 0; i < 240; i++) { time += STEP; stepBody(STEP); stepStrands(STEP); stepCamera(STEP); }
requestAnimationFrame(frame);
</script>
</body>
</html>
