// sky, smog, skyline, hologram, flying cars

function drawGround(k, d, deckOnly) {

        else if (!xr && !zebra && dash && Math.abs(a - 3.5) < lw) { r = 190; g = 190; b = 210; rf = 0.2; }
        else if (!xr && Math.abs(a - (RW - 0.3)) < lw) { r = 200; g = 200; b = 215; rf = 0.2; }

        const yt = ytA + (ytB - ytA) * t, yb = ybA + (ybB - ybA) * t, fz = fogAt(z), g = gq + Math.round((1 - fz) * 4095);
        const fr = FOG[0] * fz, fg = FOG[1] * fz, fb_ = FOG[2] * fz;
        for (let y = Math.max(0, Math.ceil(yt)), y1 = Math.min(H - 1, Math.ceil(yb) - 1), i = y * W + x; y <= y1; y++, i += W) {
          const j = i * 3; col[j] = fr; col[j + 1] = fg; col[j + 2] = fb_; refl[i] = 0; GID[i] = g;
        }
      }
    }
    else for (let x = x0; x <= x1; x++) {
      const t = clamp((x + 0.5 - xa) / span, 0, 1), iz = iN + (iF - iN) * t, z = 1 / iz;
      const u = u0 + (z - Z[k]), yt = ytA + (ytB - ytA) * t, yb = ybA + (ybB - ybA) * t, hp = yb - yt, fz = fogAt(z);
      for (let y = Math.max(0, Math.ceil(yt)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
        wallTex(B, u, (yb - y - 0.5) / hp * B.h, false, z / F);
        if (TR < 0) continue;
        const i = y * W + x, j = i * 3;
        col[j] = TR + (FOG[0] - TR) * fz; col[j + 1] = TG + (FOG[1] - TG) * fz; col[j + 2] = TB + (FOG[2] - TB) * fz;
        refl[i] = 0; GID[i] = 0;
      }
    }
  }
  // corner face of the building, facing us
  if (n === B.start && k > 0) {
    const s = S[k], xw = CX[k] + wx * s, xo = CX[k] + (wx + sg * 80) * s, fz = fogAt(Z[k]);
    const ytop = GYL[k] - B.h * s, ybot = GYL[k];
    const x0 = Math.max(0, Math.ceil(Math.min(xw, xo))), x1 = Math.min(W - 1, Math.ceil(Math.max(xw, xo)) - 1);
    const dq = canDefer(B) && x0 <= x1 ? NQ++ : -1;
    if (dq >= 0) {
      const o = dq * 16; QD[o] = xw; QD[o + 1] = s; QD[o + 2] = ybot; QD[o + 3] = bi; QD[o + 12] = 1;
      const g = (dq + 1) * 4096 + Math.round((1 - fz) * 4095), fr = FOG[0] * fz, fg = FOG[1] * fz, fb_ = FOG[2] * fz;
      for (let x = x0; x <= x1; x++)
        for (let y = Math.max(0, Math.ceil(ytop)), y1 = Math.min(H - 1, Math.ceil(ybot) - 1), i = y * W + x; y <= y1; y++, i += W) {
          const j = i * 3; col[j] = fr; col[j + 1] = fg; col[j + 2] = fb_; refl[i] = 0; GID[i] = g;
        }
    }
    else for (let x = x0; x <= x1; x++) {
      const u = Math.abs(x + 0.5 - xw) / s;
      for (let y = Math.max(0, Math.ceil(ytop)); y <= Math.min(H - 1, Math.ceil(ybot) - 1); y++) {
        wallTex(B, u, (ybot - y - 0.5) / s, true, 1 / s);
        if (TR < 0) continue;
        const i = y * W + x, j = i * 3, r = TR * 0.7, g = TG * 0.7, b = TB * 0.7;
        col[j] = r + (FOG[0] - r) * fz; col[j + 1] = g + (FOG[1] - g) * fz; col[j + 2] = b + (FOG[2] - b) * fz;
        refl[i] = 0; GID[i] = 0;
      }
    }
  }
  // rooftop, when you ride above it
  if (ytB < ytA - 0.5) {
    drawRoof(k, B, wx, sg, ytA, ytB);
    if (n === B.start + (B.len >> 1) && B.roofKind >= 2 && B.roofKind <= 4 && projAt(k, 0) && PZ < 500) {   // rooftop lights
      const fz = fogAt(PZ), rx = PCX + (wx + sg * 13) * PS, ry = PGL - B.h * PS;
      if (B.roofKind === 2) for (let i = 0; i < 8; i++) {             // landing lights chasing round the pad
        const a = i / 8 * 2 * Math.PI, on = ((i - Math.floor(T * 6)) % 8 + 8) % 8 < 2;
        if (on && projAt(k, 7 * Math.sin(a))) addLight(PCX + (wx + sg * (13 + 7 * Math.cos(a))) * PS, PGL - B.h * PS, clamp(1.2 * PS, 2 * PXS, 10 * PXS), [255, 220, 120], 0.6 * (1 - fz));
      }
      else addLight(rx, ry, clamp(8 * PS, 4 * PXS, 30 * PXS), B.roofKind === 3 ? [255, 190, 110] : B.lobby, 0.3 * (1 - fz));
    }
  }
  // antenna masts with aviation lights on the tall towers
  if (n === B.start + (B.len >> 1) && (B.style === D.BAZAAR || B.style === D.CITADEL) && projAt(k, 0) && PZ < 600) {
    if (B.style === D.BAZAAR) drawDome(B, wx, sg); else drawCoil(B, wx, sg);
  }
  else if (n === B.start + (B.len >> 1) && B.landmark && projAt(k, 0) && PZ < 700) {
    const s = PS, fz = fogAt(PZ), ax = PCX + (wx + sg * 5) * s, top = PGL - B.h * s, mh = Math.max(0, Math.min(10 + hash(B.id, 1, 5) * 22, LH[2] - 3 - B.h)) * s;
    rect(ax - Math.max(0.5 * PXS, 0.15 * s), ax + Math.max(0.5 * PXS, 0.15 * s), top - mh, top, [40, 38, 52], fz);
    if (s > 1.5) rect(ax - 0.6 * s, ax + 0.6 * s, top - mh * 0.55, top - mh * 0.55 + Math.max(1 * PXS, 0.15 * s), [40, 38, 52], fz);
    if ((T * 1.2 + B.id * 0.37) % 1.5 < 0.5) {
      const xx = Math.round(ax), yy = Math.round(top - mh);
      if (xx >= 0 && xx < W && yy >= 0 && yy < H) putc(xx, yy, [255, 50, 50]);
      addLight(ax, top - mh, clamp(1.5 * s, 3 * PXS, 14 * PXS), [255, 40, 40], 0.6 * (1 - fz));
    }
  }
  // blade signs and billboard glow
  for (const sn of B.signs) if (sn.u >= u0 && sn.u < u0 + SEGL) drawSign(k, sn.u - u0, wx, -sg, sn);
  if (B.style === 7) for (let uc = 5; uc < B.len * SEGL; uc += 10) {
    if (uc >= u0 && uc < u0 + SEGL && projAt(k, uc - u0) && PZ < 200)
      addLight(PCX + wx * PS, PGL - (B.h / 2 + 1) * PS, Math.min(26 * PXS, 5 * PS), B.shop[Math.floor(uc / 10) % 3], 0.25 * (1 - fogAt(PZ)));
  }
  for (const b of B.bbs) {
    const uc = (b.u0 + b.u1) / 2;
    if (uc >= u0 && uc < u0 + SEGL && projAt(k, uc - u0) && PZ < 220) {
      addLight(PCX + wx * PS, PGL - (b.v0 + b.v1) / 2 * PS, (b.u1 - b.u0) * PS * 0.55, b.c1, 0.3 * (1 - fogAt(PZ)));
    }
  }
}

let PZ, PS, PCX, PGY, PGL;
function projAt(k, dz) {
  const z = Z[k] + dz; if (z < NEAR) return false;
  const iN = 1 / Z[k], iF = 1 / Z[k + 1], t = (1 / z - iN) / (iF - iN);
  PZ = z; PS = F / z; PCX = CX[k] + (CX[k + 1] - CX[k]) * t; PGY = GY[k] + (GY[k + 1] - GY[k]) * t;
  PGL = PGY + (EL[k] + (EL[k + 1] - EL[k]) * t) * PS;
  return true;
}

function drawSign(k, dz, wx, inward, sn) {
  if (!projAt(k, dz)) return;
  if (PS < 1.4) {                                   // far away: a plain lit slab, no letters, no glow
    const xa = PCX + wx * PS, xb = PCX + (wx + inward * 1.6) * PS;
    rect(xa, xb, PGL - sn.v1 * PS, PGL - sn.v0 * PS, mix(sn.c, [0, 0, 0], 0.45), fogAt(PZ));
    return;
  }
  const s = PS, fz = fogAt(PZ);
  const xa = PCX + wx * s, xb = PCX + (wx + inward * 1.6) * s;
  const yt = PGL - sn.v1 * s, yb = PGL - sn.v0 * s;
  const TW = 5, TH = Math.max(6, Math.round((sn.v1 - sn.v0) / 1.6 * 5));
  const flick = sn.dead ? (hash(Math.floor(T * 9), sn.seed, 6) < 0.06 ? 1 : 0.12) : hash(Math.floor(T * 7), sn.seed, 5) < 0.04 ? 0.25 : 1;
  const x0 = Math.max(0, Math.ceil(Math.min(xa, xb))), x1 = Math.min(W - 1, Math.ceil(Math.max(xa, xb)) - 1);
  for (let x = x0; x <= x1; x++) {
    const uu = Math.abs(x + 0.5 - xa) / Math.abs(xb - xa), i0 = Math.min(TW - 1, Math.floor(uu * TW));
    for (let y = Math.max(0, Math.ceil(yt)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
      const j0 = Math.min(TH - 1, Math.floor((y + 0.5 - yt) / (yb - yt) * TH));
      let c;
      if (i0 === 0 || i0 === TW - 1 || j0 === 0 || j0 === TH - 1) c = mix(sn.c, [0, 0, 0], 0.35);
      else {
        const ch = Math.floor((j0 - 1) / 5), jj = (j0 - 1) % 5;
        c = jj < 4 && hash(ch, (i0 - 1) + jj * 3, sn.seed) < 0.55 ? mix([30, 10, 30], sn.c, flick) : [20, 8, 24];
      }
      put(x, y, c[0] + (FOG[0] - c[0]) * fz, c[1] + (FOG[1] - c[1]) * fz, c[2] + (FOG[2] - c[2]) * fz);
      refl[y * W + x] = 0;
    }
  }
  addLight((xa + xb) / 2, (yt + yb) / 2, Math.max(3 * PXS, 2.2 * s), sn.c, 0.36 * flick * (1 - fz));
}

function rect(xa, xb, ya, yb, c, fz) {
  const r = c[0] + (FOG[0] - c[0]) * fz, g = c[1] + (FOG[1] - c[1]) * fz, b = c[2] + (FOG[2] - c[2]) * fz;
  for (let x = Math.max(0, Math.ceil(Math.min(xa, xb))); x <= Math.min(W - 1, Math.ceil(Math.max(xa, xb)) - 1); x++)
    for (let y = Math.max(0, Math.ceil(ya)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
      const i = y * W + x, j = i * 3; col[j] = r; col[j + 1] = g; col[j + 2] = b; refl[i] = 0; GID[i] = 0;
    }
}

function drawLamp(k, n, sg) {
  if (!projAt(k, 0)) return;
  const s = PS, fz = fogAt(PZ), lat = sg * (RW + 0.6), lat2 = sg * (RW - 2), w = Math.max(1 * PXS, 0.18 * s);
  const x = PCX + lat * s, x2 = PCX + lat2 * s, top = PGY - 7 * s;
  rect(x - w / 2, x + w / 2, top, PGY, [26, 22, 36], fz);
  rect(Math.min(x, x2), Math.max(x, x2), top - 0.2 * s - 1, top, [26, 22, 36], fz);
  const lc = district(n) === 4 ? [255, 150, 60] : n % 18 === 0 ? [255, 70, 200] : [120, 240, 255];
  const off = TH.dark > 0.5 && hash(n * 3 + sg, Math.floor(T * 5), 17) < 0.7;   // blackout: lamps sputter
  rect(x2 - 0.5 * s, x2 + 0.5 * s, top, top + Math.max(1 * PXS, 0.22 * s), off ? [30, 28, 34] : mix(lc, [255, 255, 255], 0.5), fz * 0.6);
  if (PZ < 220 && !off) {
    addLight(x2, top + 1, Math.min(14 * PXS, Math.max(3 * PXS, 1.8 * s)), lc, 0.55 * (1 - fz));
    addLight(x2, PGY - 0.2 * s, Math.min(22 * PXS, Math.max(3 * PXS, 3 * s)), lc, 0.16 * (1 - fz));
  }
}

function drawBridge(k) {
  if (!projAt(k, 0)) return;
  const s = PS, fz = fogAt(PZ), ytop = PGY - 10.8 * s, yu = PGY - 8.4 * s;
  for (const sg of [-1, 1]) {
    const xp = PCX + sg * (RW + 1.6) * s;
    rect(xp - 0.5 * s, xp + 0.5 * s, yu, PGY, [24, 20, 36], fz);
  }
  rect(PCX - 70 * s, PCX + 70 * s, ytop, yu, [22, 18, 32], fz);
  rect(PCX - 70 * s, PCX + 70 * s, ytop, ytop + Math.max(1 * PXS, 0.3 * s), [255, 46, 170], fz * 0.5);
  // lit lettering across the middle
  const xa = PCX - 8 * s, xb = PCX + 8 * s, ya = PGY - 10.2 * s, yb = PGY - 8.9 * s;
  for (let x = Math.max(0, Math.ceil(xa)); x <= Math.min(W - 1, Math.ceil(xb) - 1); x++) {
    const gi = Math.floor((x + 0.5 - xa) / (xb - xa) * 32);
    for (let y = Math.max(0, Math.ceil(ya)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
      const gj = Math.floor((y + 0.5 - ya) / (yb - ya) * 5);
      if (gi % 4 !== 3 && hash(gi >> 2, (gi & 3) + gj * 3, 777) < 0.55) put(x, y, ...mix([0, 230, 255], FOG, fz));
    }
  }
  for (let l = -24; l <= 24; l += 4) addLight(PCX + l * s, yu + 1, Math.max(2 * PXS, 1.4 * s), [255, 200, 120], 0.4 * (1 - fz));
  addLight(PCX, (ya + yb) / 2, Math.max(4 * PXS, 7 * s), [0, 230, 255], 0.35 * (1 - fz));
}

function drawCar(c, k, dz) {
  if (!projAt(k, dz)) return;
  const s = PS, fz = fogAt(PZ), w = 1.9 * s, h = 1.35 * s, xc = PCX + (c.x - 0) * s, yb = PGY, left = xc - w / 2, top = yb - h;
  const rear = c.dir > 0, lc = rear ? c.tail : [230, 240, 255], vis = 1 - fz;
  if (w < 3) {
    const y = Math.round(yb - h * 0.4);
    putc(Math.round(left), y, lc); putc(Math.round(left + w), y, lc);
    addLight(xc, y, rear ? 2 : 4, lc, (rear ? 0.4 : 0.7) * vis);
    return;
  }
  const bd = c.body;
  for (let x = Math.max(0, Math.ceil(left)); x <= Math.min(W - 1, Math.ceil(left + w) - 1); x++) {
    const u = (x + 0.5 - left) / w;
    for (let y = Math.max(0, Math.ceil(top)); y <= Math.min(H - 1, Math.ceil(yb) - 1); y++) {
      const v = (yb - y - 0.5) / h;
      let cc;
      if (v < 0.13) cc = (u < 0.2 || u > 0.8) ? [6, 6, 8] : [10, 10, 14];
      else if (v < 0.24) cc = [bd[0] * 0.55, bd[1] * 0.55, bd[2] * 0.55];
      else if (v < 0.33 && u > 0.4 && u < 0.6) cc = rear ? [170, 170, 150] : [30, 30, 40];
      else if (v > 0.36 && v < 0.47) {
        if (rear) cc = (u < 0.28 || u > 0.72) ? lc : [lc[0] * 0.45, lc[1] * 0.45, lc[2] * 0.45];
        else cc = (u < 0.28 || u > 0.72) ? lc : [20, 20, 28];
      } else if (v < 0.58) cc = v > 0.54 ? [bd[0] * 1.7, bd[1] * 1.7, bd[2] * 1.7] : bd;
      else {
        const inset = 0.1 + (v - 0.58) * 0.45;
        if (u < inset || u > 1 - inset) continue;
        if (v > 0.62 && v < 0.92 && u > inset + 0.05 && u < 1 - inset - 0.05) {
          cc = ((u * 3 + v * 2 + 0.3) % 1) < 0.14 ? [70, 46, 100] : [16, 18, 30];
        } else cc = [bd[0] * 1.15, bd[1] * 1.15, bd[2] * 1.15];
      }
      put(x, y, cc[0] + (FOG[0] - cc[0]) * fz, cc[1] + (FOG[1] - cc[1]) * fz, cc[2] + (FOG[2] - cc[2]) * fz);
      refl[y * W + x] = 0;
    }
  }
  const ly = yb - h * 0.42;
  if (PZ > 220) return;
  if (rear) {
    const bi = c.brk ? 0.95 : 0.5;
    addLight(left + w * 0.14, ly, clamp(w * (c.brk ? 0.7 : 0.45), 2 * PXS, 20 * PXS), lc, bi * vis);
    addLight(left + w * 0.86, ly, clamp(w * (c.brk ? 0.7 : 0.45), 2 * PXS, 20 * PXS), lc, bi * vis);
  } else {
    addLight(left + w * 0.14, ly, clamp(w * 0.9, 3 * PXS, 30 * PXS), lc, 0.85 * vis);
    addLight(left + w * 0.86, ly, clamp(w * 0.9, 3 * PXS, 30 * PXS), lc, 0.85 * vis);
  }
  if (c.neon) addLight(xc, yb, clamp(w * 0.75, 2 * PXS, 24 * PXS), c.under, 0.4 * vis);
}

// tiny 3x5 font
const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001001001001', '8': '111101111101111', '9': '111101111001111',
  'K': '101101110101101', 'M': '101111111101101', 'H': '101101111101101', '/': '001001010100100', 'A': '010101111101101',
  'U': '101101101101111', 'T': '111010010010010', 'O': '111101101101111', 'N': '110101101101101', 'L': '100100100100111',
  'R': '110101110101101', 'I': '111010010010111', ' ': '000000000000000', 'E': '111100110100111', 'P': '111101111100100',
  'D': '110101101101110', 'S': '111100111001111', 'C': '111100100100111',
  'W': '101101101111101', '^': '010111010010010', '_': '010010010111010', 'V': '101101101101010', 'B': '110101110101110', 'Y': '101101010010010', 'G': '111100101101111',
};
function text(str, x, y, c, sc) {
  for (const ch of str) {
    const g = FONT[ch] || FONT[' '];
    for (let i = 0; i < 15; i++) if (g[i] === '1')
      for (let a = 0; a < sc; a++) for (let b = 0; b < sc; b++) putc(x + (i % 3) * sc + a, y + Math.floor(i / 3) * sc + b, c);
    x += 4 * sc;
  }
}

function drawGlass() {
  // wind streaks rushing past the edges of the view at speed
  const wk = smooth(55, 83, speed);
  if (wk > 0.01) for (let i = 0; i < 26; i++) {
    const ang = hash(i, 1, 501) * Math.PI * 2, ph = (T * (1.2 + hash(i, 2, 502)) + hash(i, 3, 503)) % 1;
    const r0 = 0.55 + ph * 0.6, len = 0.06 + hash(i, 4, 504) * 0.08, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let t = 0; t < 1; t += 0.06) {
      const rr = r0 + len * t, x = Math.round(W / 2 + ca * rr * W * 0.5), y = Math.round(H * 0.45 + sa * rr * H * 0.5);
      addc(x, y, [200, 220, 255], 0.13 * wk * (1 - t) * (1 - ph * 0.5));
    }
  }
  // rain streaks outside
  for (const s of streaks) {
    const cd = Math.abs(s.x - W / 2) / W + Math.abs(s.y - H * 0.42) / H;   // fainter near the centre of view
    const fade = Math.min(1, cd * 2.5);
    const x = Math.round(s.x), y = Math.round(s.y);
    if (s.kind === 'rain') { const a = 0.09 * fade; if (a > 0.01) for (let k = 0; k < s.l; k++) addc(Math.round(s.x - steer * k * 0.3), y - k, [130, 150, 200], a); }
    else if (s.kind === 'monsoon') { const a = 0.14 * fade; if (a > 0.01) for (let k = 0; k < s.l * 1.6; k++) addc(Math.round(s.x - steer * k * 0.3), y - k, [150, 180, 200], a); }
    else if (s.kind === 'ash') addc(x, y, s.ph > 5 ? [255, 140, 50] : [150, 140, 140], 0.7 * fade);
    else if (s.kind === 'bubbles') { const c = [170, 230, 255]; addc(x, y, c, 0.12 * fade); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) addc(x + dx, y + dy, c, 0.45 * fade); }
    else if (s.kind === 'fireflies') { const bl = 0.5 + 0.5 * Math.sin(T * 3 + s.ph * 5), c = [200, 255, 120]; addc(x, y, c, bl); addc(x + 1, y, c, 0.35 * bl); addc(x - 1, y, c, 0.35 * bl); addc(x, y + 1, c, 0.35 * bl); addc(x, y - 1, c, 0.35 * bl); }
    else if (s.kind === 'snow') { addc(x, y, [230, 240, 255], 0.75 * fade); if (s.l > 4.5 && cd > 0.3) addc(x + 1, y, [230, 240, 255], 0.5 * fade); }
    else if (s.kind === 'petals') { const c = [255, 170, 210]; addc(x, y, c, 0.9 * fade); addc(x + (Math.sin(T * 5 + s.ph) > 0 ? 1 : -1), y, c, 0.6 * fade); }
    else if (s.kind === 'sand') { for (let k = 0; k < s.l * 2.5; k++) addc(x - k, y, [230, 160, 90], 0.14 * (1 - k / (s.l * 2.5))); }
  }
  // droplets on the windshield refract what is behind them
  if (!outside()) for (const d of drops) {
    const x = Math.round(d.x), y = Math.round(d.y);
    if (x < 1 || y < 3 || x >= W - 1 || y >= H - 1) continue;
    const j = (y * W + x) * 3;
    put(x, y, col[j] * 1.15 + 22, col[j + 1] * 1.15 + 24, col[j + 2] * 1.15 + 30);
    if (d.s === 2) { const k = ((y + 1) * W + x) * 3; put(x, y + 1, col[k] * 0.7, col[k + 1] * 0.7, col[k + 2] * 0.7); }
  }
}

function thick(x0, y0, x1, y1, r, c, hi) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++)

// ---------- the bike: the light cycle's cockpit, or no bike at all (S) ----------
const LVC = [[255, 150, 60], [0, 235, 255], [255, 60, 190]];   // level colours L1, L2, L3

function gpuSize() {                                  // (re)allocate the textures whenever the screen size changes

  alloc('ovA', OW, OH, gl.RGB32F, gl.RGB, gl.FLOAT); alloc('ovM', OW, OH, gl.RGB32F, gl.RGB, gl.FLOAT);

function upload(n, w, h, fmt, type, data) { gl.bindTexture(gl.TEXTURE_2D, GPU.tex[n]); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, fmt, type, data); }
function drawOverlays() {                             // everything drawn on top after the lean: weather, cockpit, readouts

  if (!outside()) drawBike();
  else { const I = hudInfo(), y = H - 9; text(String(I.kmh), 4, y, [150, 230, 255], 1); text('L' + (I.lv + 1), 22, y, LVC[I.lv], 1); text(I.st, 34, y, I.stC, 1); }
}
function gpuFinish(hy) {
  gpuSize();
  const glowK = (1 + 0.35 * TH.night) * (1 - 0.25 * crownK), dimK = 1 - 0.38 * TH.night;
  const cr = dimK * (1 - 0.07 * crownK), cb = dimK * (1 + 0.08 * crownK);
  const rl = outside() ? 0 : roll;
  upload('scene', SW2, SH2, gl.RGB, gl.FLOAT, colS); upload('glow', SW2, SH2, gl.RGB, gl.FLOAT, lb); upload('refl', SW2, SH2, gl.RED, gl.FLOAT, refl);
  let sceneTex = GPU.tex.scene;

    upload('gid', SW2, SH2, gl.RED, gl.FLOAT, GID);
    gl.bindTexture(gl.TEXTURE_2D, GPU.tex.quad); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 4, NQ, gl.RGBA, gl.FLOAT, QD, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, GPU.fbo); gl.viewport(0, 0, SW2, SH2); gl.useProgram(GPU.pr); gl.bindVertexArray(GPU.vao);
    const r = GPU.ur;

    gl.uniform1f(r.uT, T); gl.uniform1f(r.uFlash2, flash); gl.uniform1f(r.uT4m6, (T * 4) % 6); gl.uniform2iv(r.uFont, GPU.font);

  colO.fill(1); drawOverlays(); for (let i = 0; i < GPU.ovM.length; i++) GPU.ovM[i] = colO[i] - GPU.ovA[i];

  const u = GPU.u, fl = crashFlash * 120;
  gl.viewport(0, 0, OW * KD, OH * KD); gl.useProgram(GPU.p); gl.bindVertexArray(GPU.vao);
  [['scene', 'uScene'], ['glow', 'uGlow'], ['refl', 'uRefl'], ['ovA', 'uOvA'], ['ovM', 'uOvM']].forEach(([t, n], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t === 'scene' ? sceneTex : GPU.tex[t]); gl.uniform1i(u[n], i); });

function present8() {                                 // show a finished 8-bit frame (the CPU path and the side shot)
  if (ctx) { ctx.putImageData(img, 0, 0); return; }
  if (!GPU.ok) return;
  gpuSize();
  upload('img', OW, OH, gl.RGBA, gl.UNSIGNED_BYTE, img.data);
  gl.viewport(0, 0, OW * KD, OH * KD); gl.useProgram(GPU.p8); gl.bindVertexArray(GPU.vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, GPU.tex.img); gl.uniform1i(GPU.u8.uImg, 0); gl.uniform2i(GPU.u8.uOut, OW, OH); gl.uniform1f(GPU.u8.uKD, KD);

if (gl) {
  gpuInit();
  if (!GPU.ok) {                                      // the graphics chip refused: swap in a fresh canvas and run the original path
    const c2 = document.createElement('canvas'); c2.id = 'c'; cv.replaceWith(c2); cv = c2; gl = null; ctx = cv.getContext('2d');

// a small frame-rate readout for comparing on the device (an HTML tag, outside the game image)
const fpsEl = document.getElementById('fps');
let fpsN = 0, fpsT = 0;
function fpsTick(rawDt) {
  fpsN++; fpsT += rawDt;
  if (fpsT >= 0.5) { fpsEl.textContent = (gl && GPU.ok ? 'GPU ' : 'CPU ') + Math.round(fpsN / fpsT) + ' FPS'; fpsN = 0; fpsT = 0; }
}

function frame(now) {
  const rawDt = (now - last) / 1000;
  if (rawDt > 0 && rawDt < 1) fpsTick(rawDt);
  const dt = Math.min(0.05, Math.max(0, rawDt)); last = now;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);

// ---------- input ----------
const btnA = document.getElementById('ba');
function setAuto(on) {
  auto = on; idle = 0;
  if (on) autoLane = px < 3.5 ? 1.75 : 5.25;
  btnA.classList.toggle('on', on);
}
function manual() { if (auto) setAuto(false); idle = 0; }
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'gas', ArrowDown: 'brake' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; manual(); e.preventDefault(); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!auto);
  else if ('rRwW'.includes(e.key)) toggleRain();
  else if (e.key === 's' || e.key === 'S') cycleBike();
  else if (e.key === 'v' || e.key === 'V') cycleCruise();
  else if (e.key === 'l' || e.key === 'L') toggleLight();
  else if (e.key === 'c' || e.key === 'C') cycleShot();
  else if (e.key === 'd' || e.key === 'D') toggleHD();
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hints');
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
function hold(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); manual(); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);

hold('bl', 'left'); hold('br', 'right'); hold('bg', 'gas'); hold('bb', 'brake');
btnA.addEventListener('pointerdown', e => { e.preventDefault(); setAuto(!auto); });
const btnR = document.getElementById('br2');
function toggleRain() { rainOn = !rainOn; if (!rainOn) drops = []; btnR.classList.toggle('on', rainOn); }
btnR.addEventListener('pointerdown', e => { e.preventDefault(); toggleRain(); });
function cycleBike() {
  bikeStyle = (bikeStyle + 1) % BIKE_NAMES.length; buildBike();
  zoneEl.textContent = 'BIKE · ' + BIKE_NAMES[bikeStyle]; zoneEl.style.opacity = 1; zoneT = 2.5;
}
document.getElementById('bs').addEventListener('pointerdown', e => { e.preventDefault(); cycleBike(); });
function cycleCruise() {
  cruise = (cruise + 1) % CRUISE.length;
  zoneEl.textContent = 'CRUISE · ' + CRUISE_KMH[cruise] + ' KMH' + (auto ? '' : ' (AUTOPILOT)'); zoneEl.style.opacity = 1; zoneT = 2.5;
}
document.getElementById('bv').addEventListener('pointerdown', e => { e.preventDefault(); cycleCruise(); });
const btnH = document.getElementById('bh');

document.getElementById('bc').addEventListener('pointerdown', e => { e.preventDefault(); cycleShot(); });
const btnD = document.getElementById('bd');

  if (!gl || !GPU.ok) return;
  HDK = HDK > 1 ? 1 : 2; setup(); btnD.classList.toggle('on', HDK > 1);
  zoneEl.textContent = 'DETAIL · ' + (HDK > 1 ? 'HD' : 'CLASSIC'); zoneEl.style.opacity = 1; zoneT = 2;

if (!gl || !GPU.ok) btnD.style.display = 'none';
// keep the screen from dimming or sleeping while it plays (where the browser supports it); the lock drops
