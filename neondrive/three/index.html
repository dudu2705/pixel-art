<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Drive 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030a; user-select: none; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
  .tag { position: fixed; padding: 5px 10px; border: 1px solid #1d4f5a; background: rgba(10, 4, 14, 0.66);
         font: 12px ui-monospace, Menlo, monospace; color: #9ff4ff; letter-spacing: 1px; pointer-events: none; }
  #banner, #hint { left: 50%; transform: translateX(-50%); text-align: center; width: max-content; max-width: 86vw; }
  #banner { top: 58px; font-size: 16px; letter-spacing: clamp(2px, 0.6vw, 6px); opacity: 0; transition: opacity 1.2s; }
  #hint { top: 14px; display: none; color: #ff9ce6; border-color: #5a1d4f; }
  body.hints #hint { display: block; }
  #debug { display: none; left: 12px; top: 12px; font-size: 11px; }
  body.showfps #debug { display: block; }
  #fpsz { position: fixed; inset: 0 auto auto 0; width: 44px; height: 44px; border: 0; background: transparent; }
  #pad { display: none; }
  @media (pointer: coarse) {
    #pad { display: block; }
    .drive, .actions { display: flex; position: fixed; gap: 8px; pointer-events: none; }
    .drive { left: 12px; right: 12px; bottom: 16px; }
    .actions { right: 12px; top: 104px; flex-direction: column; }
    .drive button:nth-child(3) { margin-left: auto; }
    .btn { min-width: 58px; min-height: 46px; border: 1px solid #b2478e; border-radius: 10px;
           color: #ffb6ef; background: rgba(20, 8, 30, 0.67); font: bold 13px ui-monospace, Menlo, monospace;
           pointer-events: auto; touch-action: none; }
    .drive button { height: 62px; }
    .btn.on, .btn:active { background: rgba(255, 60, 190, 0.45); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner" class="tag" role="status"></div>
<div id="hint" class="tag">← → steer or choose a turn near a junction · ↑ gas · ↓ brake · A autopilot · W weather · C camera · V cruise · L headlight · 6 orbit · 7 free · H hide</div>
<div id="debug" class="tag"><div id="mode"></div><div id="place"></div><div id="kmh"></div><div id="fps"></div></div>
<button id="fpsz" type="button" aria-label="Toggle driving diagnostics"></button>
<div id="pad">
  <div class="drive">
    <button class="btn" type="button" data-drive="left" aria-label="Steer left">◀</button>
    <button class="btn" type="button" data-drive="right" aria-label="Steer right">▶</button>
    <button class="btn" type="button" data-drive="brake">BRK</button>
    <button class="btn" type="button" data-drive="gas">GAS</button>
  </div>
  <div class="actions">
    <button class="btn on" type="button" data-control="a">AUTO</button>
    <button class="btn on" type="button" data-control="w">WX</button>
    <button class="btn" type="button" data-control="v">CRZ</button>
    <button class="btn on" type="button" data-control="l">LIGHT</button>
    <button class="btn" type="button" data-control="c">CAM</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
